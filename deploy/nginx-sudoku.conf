# Pegar DENTRO del bloque "server { listen 443 ssl; ... server_name giorgiomacri.com ... }"
# en /etc/nginx/sites-available/giorgiomacri.com (después de que certbot lo haya creado).

    # API del torneo -> app de Node en el puerto 3001
    location /api/sudoku/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # El panel no aparece en buscadores
    location /sudoku/admin/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ =404;
    }

    # Las páginas se revisan siempre contra el servidor (así los cambios se ven al instante, también en el celular)
    location ~ \.html$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
