<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Giorgio Macri</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&display=swap">
<style>
/* Layout: plancha persimmon con el nombre gigante; debajo, cada proyecto es una franja de color a sangre con su nombre grande y un círculo azul que abre el link. */
:root {
  --persimmon: #fd9b65;
  --blush: #e9d1c7;
  --candle: #f8f5d1;
  --sage: #9ac8ae;
  --ink-blue: #004b82;
  --ink: #000000;
  --paper: #ffffff;
  --font: 'Inter Tight', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --gutter: clamp(16px, 5vw, 72px);
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--font); font-size: 16px; line-height: 1.3; letter-spacing: 0.01em;
  font-feature-settings: "ss01" on, "tnum" on; -webkit-font-smoothing: antialiased;
}
::selection { background: var(--ink-blue); color: var(--paper); }
:focus-visible { outline: 2px solid var(--ink-blue); outline-offset: 3px; }
.band {
  padding-left: max(var(--gutter), env(safe-area-inset-left, 0px));
  padding-right: max(var(--gutter), env(safe-area-inset-right, 0px));
}

.hero { background: var(--persimmon); min-height: 88svh; display: flex; align-items: flex-end; padding-block: 32px; }
.mast { margin: 0; font-weight: 400; font-size: clamp(64px, 16.5vw, 331px); line-height: 0.8; letter-spacing: -0.02em; }
.mast span { display: block; }

/* Proyectos: cada <a class="project"> es una franja. Los colores rotan solos. */
.projects { display: flex; flex-direction: column; }
.project {
  display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 32px;
  min-height: 40svh; padding-block: 32px; text-decoration: none; color: var(--ink);
}
.project:nth-child(4n+1) { background: var(--blush); }
.project:nth-child(4n+2) { background: var(--candle); }
.project:nth-child(4n+3) { background: var(--sage); }
.project:nth-child(4n+4) { background: var(--paper); }
.project .meta { grid-column: 1 / -1; align-self: start; text-align: right; }
.project .name { margin: 0; font-weight: 400; font-size: clamp(48px, 9vw, 168px); line-height: 0.85; letter-spacing: -0.02em; min-width: 0; overflow-wrap: anywhere; }
.go {
  width: 56px; height: 56px; border-radius: 9999px; background: var(--ink-blue); color: var(--paper);
  display: grid; place-content: center; font-size: 22px; transition: transform .2s ease;
}
.project:hover .go { transform: translateX(6px); }
@media (prefers-reduced-motion: reduce) { .go { transition: none; } }

.empty { background: var(--candle); min-height: 40svh; padding-block: 32px; display: flex; flex-direction: column; justify-content: space-between; gap: 48px; }
.empty .meta { text-align: right; }
.empty p { margin: 0; font-size: clamp(32px, 4.2vw, 64px); line-height: 1; letter-spacing: -0.015em; }

.foot { background: var(--paper); padding-block: 24px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
</style>
</head>
<body>

<header class="hero band">
  <h1 class="mast"><span>© Giorgio</span><span>Macri</span></h1>
</header>

<main class="projects" id="proyectos">
  <!-- Para sumar un proyecto, copiar este bloque:
  <a class="project band" href="/sudoku/">
    <span class="meta">Juego — 2026</span>
    <h2 class="name">Sudoku</h2>
    <span class="go" aria-hidden="true">→</span>
  </a>
  -->
  <a class="project band" href="/sudoku/">
    <span class="meta">Juego — 2026</span>
    <h2 class="name">Sudoku</h2>
    <span class="go" aria-hidden="true">→</span>
  </a>
</main>

<footer class="foot band">
  <span>giorgiomacri.com</span>
  <span>© 2026</span>
</footer>
</body>
</html>
