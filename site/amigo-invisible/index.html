<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Amigo invisible</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f0f14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap">
<script>try{var t=localStorage.getItem('gm-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<style>
/* Amigo invisible: link oculto (no está en la portada). Cada uno toca su nombre, elige un PIN y ve solo a quién le
   regala. El sorteo lo hace el servidor; ni el admin ve el resultado completo. */
:root {
  --bg: #0f0f14; --card: #1b1b23; --card-2: #23232d; --line: #2a2a35; --line-2: #383845;
  --fg: #f1efe9; --fg-2: #a3a1ad; --fg-3: #6d6b78;
  --accent: #fd9b65; --on-accent: #1a0f08; --bad: #ff7a6b; --ok: #9ac8ae; --field: #14141a;
  --font: 'Inter Tight', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f6f5f1; --card: #ffffff; --card-2: #f3f1ec; --line: #e2dfd7; --line-2: #d3cfc5; --fg: #15141a; --fg-2: #5d5b66; --fg-3: #8d8a95;
    --accent: #c4501a; --on-accent: #ffffff; --bad: #c8321f; --ok: #2f8f5b; --field: #ffffff;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f6f5f1; --card: #ffffff; --card-2: #f3f1ec; --line: #e2dfd7; --line-2: #d3cfc5; --fg: #15141a; --fg-2: #5d5b66; --fg-3: #8d8a95;
  --accent: #c4501a; --on-accent: #ffffff; --bad: #c8321f; --ok: #2f8f5b; --field: #ffffff;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.wrap { max-width: 600px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.top { border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 58px; }
.mark { font-weight: 700; font-size: 18px; letter-spacing: -0.02em; text-decoration: none; color: var(--fg); }
.mark span { color: #fd9b65; }
.top-r { display: flex; align-items: center; gap: 8px; }
.icon-btn { width: 38px; height: 38px; flex: none; border-radius: 10px; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; padding: 0; color: var(--fg-2); }
.icon-btn:hover { color: var(--fg); }

main { padding-block: 32px 72px; }
.eyebrow { margin: 0 0 6px; font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
h1 { margin: 0; font-size: 32px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 0; }
.chip { font-size: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; color: var(--fg-2); }
.chip b { color: var(--fg); font-weight: 600; }
.notes { margin: 12px 0 0; color: var(--fg-2); white-space: pre-wrap; }
.progress { margin: 22px 0 10px; font-size: 14px; color: var(--fg-3); }
.bar { height: 6px; border-radius: 3px; background: var(--card-2); overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; background: var(--ok); border-radius: 3px; transition: width .4s; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
h2 { margin: 0 0 4px; font-size: 19px; letter-spacing: -0.01em; }
.hint { margin: 0 0 14px; color: var(--fg-2); font-size: 15px; }
.names { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
.name { text-align: left; border: 1px solid var(--line-2); background: var(--card-2); border-radius: 12px; padding: 11px 12px; font-weight: 600; font-size: 15px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 2px 8px; min-height: 48px; }
.name:hover { border-color: var(--accent); }
.name small { font-weight: 500; font-size: 12px; color: var(--fg-3); white-space: nowrap; }
.name span { overflow-wrap: anywhere; line-height: 1.25; }

.btn { height: 46px; border: 0; border-radius: 10px; padding: 0 20px; background: var(--accent); color: var(--on-accent); font-weight: 600; font-size: 16px; }
.btn:hover { filter: brightness(1.06); }
.btn:disabled { opacity: .55; cursor: default; filter: none; }
.btn.ghost { background: var(--card-2); color: var(--fg); border: 1px solid var(--line-2); }
.btn.sm { height: 34px; padding: 0 12px; font-size: 14px; border-radius: 8px; }
.btn.danger { background: transparent; color: var(--bad); border: 1px solid color-mix(in srgb, var(--bad) 40%, var(--line)); }
.link { border: 0; background: none; padding: 0; color: var(--accent); font-size: 15px; text-decoration: underline; text-underline-offset: 3px; }
input[type="text"], input[type="password"], textarea { width: 100%; border: 1px solid var(--line-2); border-radius: 10px; background: var(--field); padding: 0 14px; height: 46px; font-size: 16px; outline: none; }
textarea { padding: 12px 14px; height: auto; min-height: 110px; resize: vertical; line-height: 1.45; }
input:focus, textarea:focus { border-color: var(--accent); }
.row { display: flex; gap: 8px; }
.row input { flex: 1; min-width: 0; }
.pin { letter-spacing: .3em; font-size: 20px !important; }
.err { color: var(--bad); font-size: 14px; margin: 8px 0 0; min-height: 1.2em; }
.okmsg { color: var(--ok); font-size: 14px; margin: 8px 0 0; min-height: 1.2em; }

/* Revelación */
.hello { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin: 26px 0 12px; font-size: 15px; color: var(--fg-2); }
.hello b { color: var(--fg); }
.gift { position: relative; width: 100%; min-height: 230px; border: 0; padding: 0; background: none; perspective: 1000px; display: block; }
.gift-in { position: relative; width: 100%; min-height: 230px; transition: transform .7s cubic-bezier(.2, .8, .2, 1); transform-style: preserve-3d; }
.gift.open .gift-in { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px; backface-visibility: hidden; -webkit-backface-visibility: hidden; text-align: center; }
.front { background: linear-gradient(145deg, #fd9b65, #e9846f 55%, #c9603c); color: #1a0f08; }
.front b { font-size: 19px; }
.front span { font-size: 14px; opacity: .8; }
.back { transform: rotateY(180deg); background: var(--card); border: 1px solid var(--line-2); }
.back small { font-size: 14px; color: var(--fg-3); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
.back strong { font-size: 36px; line-height: 1.1; letter-spacing: -0.02em; overflow-wrap: anywhere; }
.back span { font-size: 13px; color: var(--fg-3); }
.wish { margin-top: 14px; }
.wish p.txt { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--fg); }
.wish .empty { color: var(--fg-3); margin: 0; }
.sec { margin-top: 14px; }

/* Admin */
.admin { margin-top: 36px; display: flex; flex-direction: column; gap: 14px; }
.admin h2 small { font-size: 13px; color: var(--fg-3); font-weight: 500; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.form { display: flex; flex-direction: column; gap: 8px; }
.people { list-style: none; margin: 0; padding: 0; }
.people li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 15px; }
.people li:first-child { border-top: 0; }
.st { font-size: 13px; color: var(--fg-3); white-space: nowrap; }
.st.seen { color: var(--ok); }
.msg { background: var(--card-2); border-radius: 10px; padding: 12px; font-size: 14px; white-space: pre-wrap; color: var(--fg-2); margin: 0 0 10px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
@media (max-width: 480px) { h1 { font-size: 27px; } .grid2 { grid-template-columns: 1fr; } .names { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (prefers-reduced-motion: reduce) { .gift-in { transition: none; } }
</style>
</head>
<body>
<header class="top">
  <div class="wrap top-in">
    <a class="mark" href="/">giorgiomacri<span>/</span></a>
    <div class="top-r">
      <button class="icon-btn" type="button" id="themeBtn" aria-label="Cambiar tema"></button>
      <span id="gmAuth" hidden></span>
    </div>
  </div>
</header>

<main class="wrap">
  <p class="eyebrow">Amigo invisible</p>
  <h1 id="title">Amigo invisible</h1>
  <div class="chips" id="chips"></div>
  <p class="notes" id="notes" hidden></p>
  <div class="progress" id="progress" hidden><span id="progTxt"></span><div class="bar"><i id="progBar" style="width:0"></i></div></div>

  <p class="hint" id="empty" hidden style="margin-top:20px">Todavía no hay sorteo.</p>

  <!-- 1. ¿Quién sos? -->
  <section class="card" id="pickView" hidden>
    <h2>¿Quién sos?</h2>
    <p class="hint">Tocá tu nombre. Solo vas a ver a quién le regalás vos.</p>
    <div class="names" id="names"></div>
  </section>

  <!-- 2. PIN -->
  <section class="card" id="pinView" hidden>
    <h2 id="pinTitle"></h2>
    <p class="hint" id="pinHint"></p>
    <form id="pinForm" novalidate>
      <div class="row">
        <input type="password" class="pin" id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="8" placeholder="••••" autocomplete="off">
        <button class="btn" type="submit" id="pinBtn">Entrar</button>
      </div>
      <p class="err" id="pinErr" role="alert"></p>
    </form>
    <button class="link" type="button" id="pinBack">No soy yo, volver</button>
  </section>

  <!-- 3. Mi amigo invisible -->
  <section id="meView" hidden>
    <div class="hello"><span>Hola, <b id="meName"></b></span><button class="link" type="button" id="logout">Salir</button></div>
    <button class="gift" type="button" id="gift" aria-live="polite">
      <div class="gift-in">
        <div class="face front">
          <svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg>
          <b id="frontTxt">Tocá para descubrir a quién le regalás</b>
          <span>Fijate que nadie esté mirando tu pantalla</span>
        </div>
        <div class="face back">
          <small>Le regalás a</small>
          <strong id="targetName"></strong>
          <span>Tocá para ocultarlo</span>
        </div>
      </div>
    </button>

    <div class="card wish" id="theirWish" hidden>
      <h2>Ideas de <span id="wishWho"></span></h2>
      <div id="wishBody"></div>
    </div>

    <div class="card sec">
      <h2>Tus ideas para tu regalo</h2>
      <p class="hint">Opcional. Solo las ve quien te tiene que regalar (no sabe que sos vos quien las ve, ni vos sabés quién es).</p>
      <textarea id="myWish" maxlength="600" placeholder="Talle, cosas que te gustan, algo que necesites…"></textarea>
      <div class="actions" style="margin-top:10px"><button class="btn sm" type="button" id="saveWish">Guardar ideas</button></div>
      <p class="okmsg" id="wishMsg" role="status"></p>
    </div>
  </section>

  <!-- Admin (cuenta del sitio) -->
  <section class="admin" id="admin" hidden></section>
</main>

<script>
/* Cuenta única de giorgiomacri.com: botón "Entrar" / menú de la cuenta arriba a la derecha (en #gmAuth).
 * Una sesión para todo: el token se copia a las claves que usan Sudoku, Calorías, Agenda, Asistente y Estudio.
 * window.GMAuth: { me(), token(), open(), logout(), ready }  ·  window.gmAccount: compatibilidad con Sudoku. */
(function () {
  'use strict';
  if (window.GMAuth) return;
  var API = '/api/sudoku/auth';
  var K = { token: 'gm-token', me: 'gm-me', torneo: 'gm-torneo-token', torneoMe: 'gm-torneo-me', cal: 'gm-cal-token', agenda: 'gm-agenda-token' };
  var EXTRA = ['gm-cal-cache', 'gm-agenda-cache', 'gm-chat-v1', 'gm-estudio-cache'];
  var CSS = '' +
    '.gma{--a-bg:#1b1b23;--a-card:#23232d;--a-line:#30303c;--a-fg:#f1efe9;--a-fg2:#a3a1ad;--a-acc:#fd9b65;--a-on:#1a0f08;--a-bad:#ff7a6b;' +
    'font-family:"Inter Tight",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.35;position:relative;display:inline-flex;align-items:center;-webkit-font-smoothing:antialiased}' +
    '@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .gma{--a-bg:#fff;--a-card:#f3f1ec;--a-line:#e2dfd7;--a-fg:#15141a;--a-fg2:#5d5b66;--a-acc:#c4501a;--a-on:#fff;--a-bad:#c8321f}}' +
    ':root[data-theme="light"] .gma{--a-bg:#fff;--a-card:#f3f1ec;--a-line:#e2dfd7;--a-fg:#15141a;--a-fg2:#5d5b66;--a-acc:#c4501a;--a-on:#fff;--a-bad:#c8321f}' +
    ':root[data-theme="dark"] .gma{--a-bg:#1b1b23;--a-card:#23232d;--a-line:#30303c;--a-fg:#f1efe9;--a-fg2:#a3a1ad;--a-acc:#fd9b65;--a-on:#1a0f08;--a-bad:#ff7a6b}' +
    '.gma *{box-sizing:border-box}.gma button,.gma input{font:inherit}' +
    '.gma-in{height:36px;border:0;border-radius:999px;padding:0 14px;background:var(--a-acc);color:var(--a-on);font-weight:600;cursor:pointer;white-space:nowrap}' +
    '.gma-me{height:36px;border:1px solid var(--a-line);border-radius:999px;padding:0 10px 0 4px;background:var(--a-card);color:var(--a-fg);display:flex;align-items:center;gap:7px;cursor:pointer;max-width:12rem}' +
    '.gma-me i{flex:none;width:28px;height:28px;border-radius:50%;background:var(--a-acc);color:var(--a-on);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:13px;text-transform:uppercase}' +
    '.gma-me span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}' +
    '@media (max-width:520px){.gma-me{padding:0 4px}.gma-me span{display:none}}' +
    '.gma-menu{position:absolute;right:0;top:calc(100% + 8px);z-index:80;min-width:220px;background:var(--a-bg);color:var(--a-fg);border:1px solid var(--a-line);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.35);padding:6px}' +
    '.gma-menu .hd{padding:8px 10px 10px;border-bottom:1px solid var(--a-line);margin-bottom:4px}.gma-menu .hd b{display:block;font-size:15px}.gma-menu .hd small{color:var(--a-fg2)}' +
    '.gma-menu a,.gma-menu button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--a-fg);padding:9px 10px;border-radius:9px;text-decoration:none;cursor:pointer;font-size:14px}' +
    '.gma-menu a:hover,.gma-menu button:hover{background:var(--a-card)}.gma-menu .out{color:var(--a-bad)}.gma-menu hr{border:0;border-top:1px solid var(--a-line);margin:4px 0}' +
    '.gma-dlg{border:0;border-radius:16px;padding:0;width:min(380px,calc(100vw - 32px));background:var(--a-bg);color:var(--a-fg);box-shadow:0 30px 80px rgba(0,0,0,.45)}' +
    '.gma-dlg::backdrop{background:rgba(8,8,12,.55)}' +
    '.gma-dlg form{padding:22px;display:flex;flex-direction:column;gap:12px}.gma-dlg h3{margin:0;font-size:21px;letter-spacing:-.01em}.gma-dlg p{margin:0;color:var(--a-fg2);font-size:13px}' +
    '.gma-dlg label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--a-fg2)}' +
    '.gma-dlg input{height:44px;border:1px solid var(--a-line);border-radius:10px;background:var(--a-card);color:var(--a-fg);padding:0 12px;font-size:16px;outline:none}.gma-dlg input:focus{border-color:var(--a-acc)}' +
    '.gma-dlg .err{color:var(--a-bad);min-height:1.2em;font-size:13px}' +
    '.gma-dlg .row{display:flex;gap:8px;justify-content:flex-end}.gma-dlg .row button{height:42px;border:0;border-radius:10px;padding:0 16px;font-weight:600;cursor:pointer}' +
    '.gma-dlg .ok{background:var(--a-acc);color:var(--a-on)}.gma-dlg .no{background:var(--a-card);color:var(--a-fg)}.gma-dlg .ok:disabled{opacity:.5}';

  function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function set(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  var token = get(K.token), me = null;
  try { me = JSON.parse(get(K.me) || 'null'); } catch (e) {}
  if (!token) { token = get(K.cal) || get(K.torneo) || get(K.agenda) || null; me = null; }

  // Copia la sesión a las claves de cada programa (así todos ven la misma cuenta)
  function sync() {
    set(K.token, token); set(K.me, me ? JSON.stringify(me) : null);
    var acct = me && me.kind === 'account';
    set(K.cal, acct ? token : null);
    set(K.agenda, me && me.admin ? token : null);
    set(K.torneo, me && me.player ? token : null);
    set(K.torneoMe, me && me.player ? JSON.stringify(me.player) : null);
  }
  function clearAll() { token = null; me = null; sync(); EXTRA.forEach(function (k) { set(k, null); }); try { sessionStorage.removeItem('gm-torneo-admin'); } catch (e) {} }

  function call(method, path, body, tok) {
    var h = { 'Content-Type': 'application/json' }; if (tok) h.Authorization = 'Bearer ' + tok;
    return fetch(API + path, { method: method, headers: h, body: body ? JSON.stringify(body) : undefined, cache: 'no-store' })
      .catch(function () { var e = new Error('Sin conexión con el servidor.'); e.net = true; throw e; })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) { var e = new Error(j.error || 'Algo falló.'); e.status = r.status; throw e; } return j; }); });
  }

  if (!document.getElementById('gma-css')) { var st = document.createElement('style'); st.id = 'gma-css'; st.textContent = CSS; document.head.appendChild(st); }
  var slot = null, menuOpen = false;

  function links() {
    var l = [];
    if (me && me.kind === 'account') { l.push(['/calorias/', 'Calorías']); l.push(['/estudio/', 'Estudio']); l.push(['/asistente/', 'Asistente']); }
    if (me && me.admin) l.push(['/agenda/', 'Agenda']);
    if (me && me.player) l.push(['/sudoku/torneo/', 'Torneo de sudoku']);
    if (me && me.admin) l.push(['/admin/', 'Panel de admin']);
    return l;
  }
  function render() {
    slot = slot || document.getElementById('gmAuth');
    if (!slot) return;
    slot.className = 'gma';
    if (!token || !me) { slot.innerHTML = '<button class="gma-in" type="button">Entrar</button>'; slot.firstChild.onclick = open; return; }
    var sub = me.admin ? 'Admin' : me.kind === 'player' ? 'Jugador del torneo' : 'Cuenta';
    if (me.player && me.kind === 'account' && me.player.name.toLowerCase() !== me.name.toLowerCase()) sub += ' · en el torneo: ' + me.player.name;
    slot.innerHTML = '<button class="gma-me" type="button" aria-haspopup="menu" aria-expanded="false"><i>' + esc(me.name.charAt(0)) + '</i><span>' + esc(me.name) + '</span></button>' +
      '<div class="gma-menu" role="menu" hidden><div class="hd"><b>' + esc(me.name) + '</b><small>' + esc(sub) + '</small></div>' +
      links().map(function (x) { return '<a role="menuitem" href="' + x[0] + '">' + esc(x[1]) + '</a>'; }).join('') +
      '<hr>' + (me.kind === 'account' ? '<button type="button" role="menuitem" data-pw>Cambiar contraseña</button>' : '') +
      '<button type="button" role="menuitem" data-all>Cerrar sesión en todos lados</button>' +
      '<button type="button" role="menuitem" class="out" data-out>Salir</button></div>';
    var btn = slot.querySelector('.gma-me'), menu = slot.querySelector('.gma-menu');
    btn.onclick = function (e) { e.stopPropagation(); menuOpen = menu.hidden; menu.hidden = !menuOpen; btn.setAttribute('aria-expanded', String(menuOpen)); };
    menu.querySelector('[data-out]').onclick = function () { logout(); };
    menu.querySelector('[data-all]').onclick = function () {
      menu.hidden = true;
      if (!confirm('Se cierra tu sesión en todos los dispositivos, incluido este. ¿Seguimos?')) return;
      var t = token; clearAll();
      var go = function () { location.reload(); };
      fetch(API + '/logout-all', { method: 'POST', headers: { Authorization: 'Bearer ' + t } }).then(go, go);
    };
    var pw = menu.querySelector('[data-pw]'); if (pw) pw.onclick = function () { menu.hidden = true; password(); };
  }
  document.addEventListener('click', function (e) { if (!slot) return; var m = slot.querySelector('.gma-menu'); if (m && !m.hidden && !slot.contains(e.target)) m.hidden = true; });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && slot) { var m = slot.querySelector('.gma-menu'); if (m) m.hidden = true; } });

  function dialog(html, onSubmit) {
    var d = document.createElement('dialog'); d.className = 'gma-dlg';
    var wrap = document.createElement('div'); wrap.className = 'gma'; wrap.style.display = 'block';
    d.innerHTML = '<form novalidate>' + html + '<p class="err" role="alert"></p><div class="row"><button class="no" type="button">Cancelar</button><button class="ok" type="submit">Entrar</button></div></form>';
    wrap.appendChild(d); document.body.appendChild(wrap);
    var f = d.querySelector('form'), err = d.querySelector('.err'), ok = d.querySelector('.ok');
    d.querySelector('.no').onclick = function () { d.close(); };
    d.addEventListener('close', function () { wrap.remove(); });
    f.onsubmit = function (e) {
      e.preventDefault(); err.textContent = ''; ok.disabled = true;
      Promise.resolve(onSubmit(f)).then(function (close) { if (close !== false) d.close(); }, function (x) { err.textContent = x.message; }).then(function () { ok.disabled = false; });
    };
    d.showModal(); var first = d.querySelector('input'); if (first) first.focus();
    return d;
  }
  function login(user, password) {
    return call('POST', '/login', { user: user, password: password }).then(function (r) {
      token = r.token; me = { kind: r.kind, name: r.name, admin: r.admin, player: r.player };
      sync(); location.reload(); return me;
    });
  }
  function open() {
    var d = dialog('<h3>Entrar</h3><p>Una cuenta para todo el sitio. Si solo jugás al torneo, usá tu apodo y PIN.</p>' +
      '<label>Usuario o apodo<input name="u" autocomplete="username" autocapitalize="none" spellcheck="false"></label>' +
      '<label>Contraseña o PIN<input name="p" type="password" autocomplete="current-password"></label>', function (f) {
      return login(f.u.value, f.p.value);
    });
    return d;
  }
  function password() {
    var d = dialog('<h3>Cambiar contraseña</h3>' +
      '<label>Contraseña actual<input name="c" type="password" autocomplete="current-password"></label>' +
      '<label>Nueva (mínimo 8 caracteres)<input name="n" type="password" autocomplete="new-password"></label>' +
      '<label>Repetila<input name="n2" type="password" autocomplete="new-password"></label>', function (f) {
      if (f.n.value.length < 8) throw new Error('La nueva contraseña tiene que tener al menos 8 caracteres.');
      if (f.n.value !== f.n2.value) throw new Error('Las contraseñas nuevas no coinciden.');
      return call('POST', '/password', { current: f.c.value, next: f.n.value }, token).then(function () { toast('Contraseña cambiada'); });
    });
    d.querySelector('.ok').textContent = 'Guardar';
  }
  function toast(t) {
    var el = document.createElement('div'); el.className = 'gma';
    el.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:90;display:block';
    el.innerHTML = '<div style="background:var(--a-fg);color:var(--a-bg);padding:10px 16px;border-radius:10px;font-size:14px">' + esc(t) + '</div>';
    document.body.appendChild(el); setTimeout(function () { el.remove(); }, 2600);
  }
  function logout() {
    var t = token; clearAll();
    var go = function () { location.reload(); };
    if (t) fetch(API + '/logout', { method: 'POST', headers: { Authorization: 'Bearer ' + t } }).then(go, go); else go();
  }

  // Validar la sesión con el servidor
  var ready = !token ? Promise.resolve(null) : call('GET', '/me', null, token).then(function (r) {
    var was = JSON.stringify(me); me = r; sync(); render();
    if (was !== JSON.stringify(me) && was !== 'null') document.dispatchEvent(new CustomEvent('gm-auth', { detail: me }));
    return me;
  }, function (e) {
    if (e.status === 401 || e.status === 403) { var had = !!me; clearAll(); render(); if (had) location.reload(); }
    return me;
  });
  if (token && me) sync();

  window.GMAuth = { me: function () { return token ? me : null; }, token: function () { return token; }, open: open, login: login, logout: logout, ready: ready };
  window.gmAccount = { get: function () { return token && me && me.player ? { token: token, me: { id: me.player.id, name: me.player.name } } : null; } };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', render); else render();
})();

</script>
<script>
(function () {
  'use strict';
  var API = '/api/sudoku/amigo', KEY = 'gm-amigo';
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function getK() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } }
  function setK(v) { try { if (v) localStorage.setItem(KEY, JSON.stringify(v)); else localStorage.removeItem(KEY); } catch (e) {} }
  var auth = getK(); // { token, name, draw }
  function call(method, path, body, admin) {
    var h = { 'Content-Type': 'application/json' };
    if (auth && auth.token) h['X-Amigo'] = auth.token;
    if (admin && window.GMAuth && GMAuth.token()) h.Authorization = 'Bearer ' + GMAuth.token();
    return fetch(API + path, { method: method, headers: h, body: body ? JSON.stringify(body) : undefined, cache: 'no-store' })
      .catch(function () { throw new Error('Sin conexión. Probá de nuevo.'); })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error(j.error || 'Algo falló. Probá de nuevo.'); return j; }); });
  }

  var S = null, picked = null, wishDirty = false;
  function load() {
    return call('GET', '').then(function (r) {
      S = r;
      if (auth && !r.me) { auth = null; setK(null); }
      render();
    }, function (e) { $('empty').hidden = false; $('empty').textContent = e.message; });
  }
  function isAdmin() { var me = window.GMAuth && GMAuth.me(); return !!(me && me.admin); }

  function render() {
    var d = S.draw;
    $('gmAuth').hidden = !(window.GMAuth && GMAuth.me());
    $('empty').hidden = !!d;
    $('title').textContent = d ? d.title : 'Amigo invisible';
    document.title = d ? d.title : 'Amigo invisible';
    var chips = [];
    if (d && d.budget) chips.push('<span class="chip">Presupuesto: <b>' + esc(d.budget) + '</b></span>');
    if (d && d.date) chips.push('<span class="chip">Entrega: <b>' + esc(d.date) + '</b></span>');
    if (d) chips.push('<span class="chip"><b>' + S.people.length + '</b> personas</span>');
    $('chips').innerHTML = chips.join('');
    $('notes').hidden = !(d && d.notes); $('notes').textContent = d ? d.notes : '';
    var seen = S.people.filter(function (p) { return p.seen; }).length;
    $('progress').hidden = !d;
    if (d) { $('progTxt').textContent = seen + ' de ' + S.people.length + ' ya vieron a quién les tocó'; $('progBar').style.width = (S.people.length ? seen / S.people.length * 100 : 0) + '%'; }

    var me = S.me;
    $('meView').hidden = !me;
    $('pickView').hidden = !d || !!me || !!picked;
    $('pinView').hidden = !d || !!me || !picked;
    if (d && !me) {
      $('names').innerHTML = S.people.map(function (p) {
        return '<button class="name" type="button" data-id="' + p.id + '"><span>' + esc(p.name) + '</span>' + (p.seen ? '<small>✓ ya vio</small>' : p.claimed ? '<small>ya entró</small>' : '') + '</button>';
      }).join('');
    }
    if (me) {
      $('meName').textContent = me.name;
      $('targetName').textContent = me.target.name;
      $('frontTxt').textContent = me.seen ? 'Tocá para ver a quién le regalás' : 'Tocá para descubrir a quién le regalás';
      $('wishWho').textContent = me.target.name;
      $('theirWish').hidden = false;
      $('wishBody').innerHTML = me.target.wishes ? '<p class="txt">' + esc(me.target.wishes) + '</p>' : '<p class="empty">Todavía no dejó ideas. Volvé a mirar más adelante.</p>';
      $('theirWish').hidden = !$('gift').classList.contains('open') && !me.seen;
      if (!wishDirty && document.activeElement !== $('myWish')) $('myWish').value = me.wishes || '';
    }
    renderAdmin();
  }

  /* ---------- Elegir nombre + PIN ---------- */
  $('names').addEventListener('click', function (e) {
    var b = e.target.closest('[data-id]'); if (!b) return;
    var p = S.people.filter(function (x) { return x.id === Number(b.getAttribute('data-id')); })[0]; if (!p) return;
    picked = p;
    $('pinTitle').textContent = '¿Sos ' + p.name + '?';
    $('pinHint').textContent = p.claimed ? 'Poné el PIN que elegiste la primera vez.' : 'Elegí un PIN de 4 números. Lo vas a necesitar si volvés a entrar desde otro celular, y hace que nadie más pueda ver tu amigo invisible.';
    $('pinBtn').textContent = p.claimed ? 'Entrar' : 'Crear PIN y entrar';
    $('pinErr').textContent = ''; $('pin').value = '';
    render(); setTimeout(function () { $('pin').focus(); }, 30);
  });
  $('pinBack').addEventListener('click', function () { picked = null; render(); });
  $('pinForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var pin = $('pin').value.trim();
    if (!/^\d{4,8}$/.test(pin)) { $('pinErr').textContent = 'El PIN tiene que ser de 4 a 8 números.'; return; }
    $('pinBtn').disabled = true;
    call('POST', '/entrar', { id: picked.id, pin: pin }).then(function (r) {
      auth = { token: r.token, name: r.name }; setK(auth); picked = null; $('gift').classList.remove('open');
      return load();
    }, function (x) { $('pinErr').textContent = x.message; }).then(function () { $('pinBtn').disabled = false; });
  });
  $('logout').addEventListener('click', function () {
    if (!confirm('¿Salir? Para volver a entrar vas a necesitar tu PIN.')) return;
    auth = null; setK(null); $('gift').classList.remove('open'); load();
  });

  /* ---------- Revelar ---------- */
  $('gift').addEventListener('click', function () {
    var open = !$('gift').classList.contains('open');
    $('gift').classList.toggle('open', open);
    $('theirWish').hidden = !open && !(S.me && S.me.seen);
    if (open && S.me && !S.me.seen) call('POST', '/visto').then(function () { S.me.seen = true; load(); }, function () {});
  });

  /* ---------- Mis ideas ---------- */
  $('myWish').addEventListener('input', function () { wishDirty = true; $('wishMsg').textContent = ''; });
  $('saveWish').addEventListener('click', function () {
    $('saveWish').disabled = true;
    call('POST', '/ideas', { wishes: $('myWish').value }).then(function () { wishDirty = false; $('wishMsg').textContent = 'Guardado.'; load(); },
      function (x) { $('wishMsg').textContent = x.message; }).then(function () { $('saveWish').disabled = false; });
  });

  /* ---------- Admin ---------- */
  var newForm = false;
  function adm(body, ok) {
    return call('POST', '/admin', body, true).then(function () { if (ok) alert(ok); newForm = false; return load(); }, function (x) { alert(x.message); });
  }
  function renderAdmin() {
    var el = $('admin');
    if (!isAdmin()) { el.hidden = true; return; }
    if (el.contains(document.activeElement) && /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return; // no pisar lo que estás escribiendo
    el.hidden = false;
    var d = S.draw, h = '';
    if (!d || newForm) {
      h += '<div class="card"><h2>' + (d ? 'Nuevo sorteo' : 'Armar el sorteo') + '</h2><p class="hint">Una persona por línea. El sorteo lo hace el servidor al crear: nadie, ni vos, ve la lista completa. Nadie se regala a sí mismo y no quedan parejas que se regalen entre sí.' + (d ? ' <b>Reemplaza al sorteo actual.</b>' : '') + '</p>' +
        '<div class="form"><input type="text" id="aTitle" maxlength="80" placeholder="Título (ej.: Amigo invisible fin de año)">' +
        '<textarea id="aNames" placeholder="Una persona por línea" style="min-height:220px"></textarea>' +
        '<div class="grid2"><input type="text" id="aBudget" maxlength="60" placeholder="Presupuesto (opcional)"><input type="text" id="aDate" maxlength="60" placeholder="Fecha de entrega (opcional)"></div>' +
        '<textarea id="aNotes" maxlength="500" placeholder="Notas (opcional): dónde, reglas…" style="min-height:70px"></textarea>' +
        '<div class="actions"><button class="btn" type="button" data-a="create">Sortear</button>' + (d ? '<button class="btn ghost" type="button" data-a="cancel">Cancelar</button>' : '') + '</div></div></div>';
    }
    if (d && !newForm) {
      var link = location.origin + '/amigo-invisible/';
      var msg = '🎁 ' + d.title + '\nEntren acá, toquen su nombre y elijan un PIN de 4 números: ' + link + (d.budget ? '\nPresupuesto: ' + d.budget : '') + (d.date ? '\nEntrega: ' + d.date : '') + '\nCada uno ve solo a quién le regala. Pueden dejar ideas para su regalo.';
      h += '<div class="card"><h2>Mensaje para el grupo</h2><p class="msg" id="aMsg">' + esc(msg) + '</p><div class="actions"><button class="btn sm" type="button" data-a="copy">Copiar mensaje</button></div></div>';
      h += '<div class="card"><h2>Datos del sorteo</h2><div class="form" style="margin-top:8px"><input type="text" id="eTitle" maxlength="80" value="' + esc(d.title) + '">' +
        '<div class="grid2"><input type="text" id="eBudget" maxlength="60" placeholder="Presupuesto" value="' + esc(d.budget) + '"><input type="text" id="eDate" maxlength="60" placeholder="Fecha de entrega" value="' + esc(d.date) + '"></div>' +
        '<textarea id="eNotes" maxlength="500" placeholder="Notas" style="min-height:70px">' + esc(d.notes) + '</textarea>' +
        '<div class="actions"><button class="btn sm" type="button" data-a="info">Guardar</button></div></div></div>';
      h += '<div class="card"><h2>Participantes <small>(no se muestra a quién le regala cada uno)</small></h2><p class="hint">Si alguien entró con un nombre que no era el suyo, o se olvidó el PIN, liberá ese nombre: el dueño elige un PIN nuevo y ve lo mismo que antes.</p><ul class="people">' +
        S.people.map(function (p) { return '<li><span>' + esc(p.name) + '</span><span class="actions" style="align-items:center"><span class="st' + (p.seen ? ' seen' : '') + '">' + (p.seen ? '✓ vio' : p.claimed ? 'entró' : 'falta') + '</span>' + '<button class="btn sm ghost" type="button" data-ren="' + p.id + '" data-n="' + esc(p.name) + '">Renombrar</button>' + (p.claimed ? '<button class="btn sm ghost" type="button" data-rel="' + p.id + '" data-n="' + esc(p.name) + '">Liberar</button>' : '') + '</span></li>'; }).join('') + '</ul></div>';
      h += '<div class="card"><h2>Rehacer</h2><p class="hint">Volver a sortear con la misma gente cambia a quién le regala cada uno (los que ya vieron tienen que volver a mirar). Nuevo sorteo empieza de cero con otra lista.</p><div class="actions"><button class="btn sm danger" type="button" data-a="redraw">Volver a sortear</button><button class="btn sm ghost" type="button" data-a="new">Nuevo sorteo</button></div></div>';
    }
    el.innerHTML = h;
  }
  $('admin').addEventListener('click', function (e) {
    var t = e.target.closest('button'); if (!t) return;
    var a = t.getAttribute('data-a');
    if (a === 'create') {
      var names = $('aNames').value.split(/\n|,/).map(function (x) { return x.trim(); }).filter(Boolean);
      if (names.length < 3) { alert('Hacen falta al menos 3 personas.'); return; }
      if (!confirm('¿Sortear entre ' + names.length + ' personas?' + (S.draw ? ' Reemplaza al sorteo actual.' : ''))) return;
      return adm({ action: 'create', title: $('aTitle').value, names: $('aNames').value, budget: $('aBudget').value, date: $('aDate').value, notes: $('aNotes').value }, 'Listo, sorteo hecho. Pasá el link al grupo.');
    }
    if (a === 'cancel') { newForm = false; renderAdmin(); return; }
    if (a === 'new') { newForm = true; renderAdmin(); return; }
    if (a === 'info') return adm({ action: 'info', title: $('eTitle').value, budget: $('eBudget').value, date: $('eDate').value, notes: $('eNotes').value });
    if (a === 'redraw') { if (confirm('¿Volver a sortear? A todos les cambia a quién le regalan.')) adm({ action: 'redraw' }, 'Listo, nuevo sorteo.'); return; }
    if (a === 'copy') {
      var txt = $('aMsg').textContent;
      (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(function () { t.textContent = '¡Copiado!'; setTimeout(function () { t.textContent = 'Copiar mensaje'; }, 1800); }, function () { prompt('Copiá el mensaje:', txt); });
      return;
    }
    if (t.hasAttribute('data-ren')) { var nn = prompt('¿Cómo tiene que figurar ' + t.getAttribute('data-n') + '? (cambia también en la votación de los Awards)', t.getAttribute('data-n')); if (nn && nn.trim() && nn.trim() !== t.getAttribute('data-n')) adm({ action: 'rename', id: Number(t.getAttribute('data-ren')), name: nn }); return; }
    if (t.hasAttribute('data-rel')) { if (confirm('¿Liberar el nombre de ' + t.getAttribute('data-n') + '? Va a tener que elegir un PIN nuevo.')) adm({ action: 'release', id: Number(t.getAttribute('data-rel')) }); }
  });
  if (window.GMAuth) { GMAuth.ready.then(function () { if (S) render(); }); document.addEventListener('gm-auth', function () { if (S) render(); }); }

  /* ---------- Tema ---------- */
  var root = document.documentElement, mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: light)') : null;
  var MOON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
  var SUN = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>';
  function theme() { var t = root.getAttribute('data-theme'); return t === 'dark' || t === 'light' ? t : (mq && mq.matches ? 'light' : 'dark'); }
  function paintTheme() { var dk = theme() === 'dark'; $('themeBtn').innerHTML = dk ? SUN : MOON; $('themeBtn').setAttribute('aria-label', dk ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'); }
  $('themeBtn').addEventListener('click', function () { var n = theme() === 'dark' ? 'light' : 'dark'; root.setAttribute('data-theme', n); try { localStorage.setItem('gm-theme', n); } catch (e) {} paintTheme(); });
  if (mq && mq.addEventListener) mq.addEventListener('change', paintTheme);
  paintTheme();

  load();
  setInterval(function () { if (!document.hidden && S && !S.me) load(); }, 20000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) load(); });
})();
</script>
