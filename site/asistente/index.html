<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Asistente</title>
<meta name="robots" content="noindex, nofollow">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#15151c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap">
<script>try{var t=localStorage.getItem('gm-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<style>
/* Layout: barra arriba y el chat ocupando todo el alto, centrado a 760 px. Login simple con el usuario de la agenda. */
:root {
  --bg: #15151c; --card: #1f1f28; --line: #30303c; --fg: #f1efe9; --fg-2: #a3a1ad; --accent: #fd9b65; --on-accent: #1a0f08; --bad: #ff7a6b; --field: #1f1f28;
  --font: 'Inter Tight', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) { --bg: #ffffff; --card: #f6f5f1; --line: #e2dfd7; --fg: #15141a; --fg-2: #5d5b66; --accent: #c4501a; --on-accent: #fff; --bad: #c8321f; --field: #fff; color-scheme: light; }
}
:root[data-theme="light"] { --bg: #ffffff; --card: #f6f5f1; --line: #e2dfd7; --fg: #15141a; --fg-2: #5d5b66; --accent: #c4501a; --on-accent: #fff; --bad: #c8321f; --field: #fff; color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px; line-height: 1.4; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
.top { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.mark { flex: 1; font-weight: 700; font-size: 18px; letter-spacing: -0.02em; text-decoration: none; color: var(--fg); }
.mark span { color: #fd9b65; }
.mark em { font-style: normal; font-weight: 500; color: var(--fg-2); }
.icon-btn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; padding: 0; color: var(--fg-2); }
.link { background: none; border: 0; padding: 0; color: var(--fg-2); text-decoration: underline; text-underline-offset: 3px; font-size: 14px; }
main { flex: 1; min-height: 0; width: 100%; max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; }
#chatBox { flex: 1; min-height: 0; display: flex; flex-direction: column; }
#chatBox > .gmc { flex: 1; min-height: 0; display: flex; flex-direction: column; }
#chatBox .gmc-panel { flex: 1; }
.login { max-width: 360px; width: 100%; margin: 12vh auto 0; padding: 0 16px; display: flex; flex-direction: column; gap: 12px; }
.login h1 { margin: 0; font-size: 30px; letter-spacing: -0.02em; }
.login p { margin: 0; color: var(--fg-2); }
.field { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--fg-2); }
.f { height: 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--field); padding: 0 12px; font-size: 16px; color: var(--fg); }
.f:focus { outline: none; border-color: var(--accent); }
.btn { height: 44px; border: 0; border-radius: 10px; background: var(--accent); color: var(--on-accent); font-weight: 600; }
.err { color: var(--bad); font-size: 14px; min-height: 1.2em; margin: 0; }
</style>
</head>
<body>
<header class="top">
  <a class="mark" href="/">giorgiomacri<span>/</span><em>asistente</em></a>
  <button class="icon-btn" type="button" id="themeBtn" aria-label="Cambiar tema"></button>
  <span id="gmAuth"></span>
  <button class="link" type="button" id="logout" hidden>Salir</button>
</header>
<main>
  <form class="login" id="loginView" hidden novalidate>
    <h1>Asistente</h1>
    <p>Solo para la cuenta de admin.</p>
    <label class="field">Usuario<input class="f" id="lUser" autocomplete="username" autocapitalize="none" spellcheck="false"></label>
    <label class="field">Contraseña<input class="f" id="lPass" type="password" autocomplete="current-password"></label>
    <p class="err" id="lErr" role="alert"></p>
    <button class="btn" type="submit" id="lBtn">Entrar</button>
  </form>
  <div id="chatBox" hidden></div>
</main>

<script>
/* Cuenta única de giorgiomacri.com: botón "Entrar" / menú de la cuenta arriba a la derecha (en #gmAuth).
 * Una sesión para todo: el token se copia a las claves que usan Sudoku, Calorías, Agenda y Asistente.
 * window.GMAuth: { me(), token(), open(), logout(), ready }  ·  window.gmAccount: compatibilidad con Sudoku. */
(function () {
  'use strict';
  if (window.GMAuth) return;
  var API = '/api/sudoku/auth';
  var K = { token: 'gm-token', me: 'gm-me', torneo: 'gm-torneo-token', torneoMe: 'gm-torneo-me', cal: 'gm-cal-token', agenda: 'gm-agenda-token' };
  var EXTRA = ['gm-cal-cache', 'gm-agenda-cache', 'gm-chat-v1'];
  var CSS = '' +
    '.gma{--a-bg:#1b1b23;--a-card:#23232d;--a-line:#30303c;--a-fg:#f1efe9;--a-fg2:#a3a1ad;--a-acc:#fd9b65;--a-on:#1a0f08;--a-bad:#ff7a6b;' +
    'font-family:"Inter Tight",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.35;position:relative;display:inline-flex;align-items:center;-webkit-font-smoothing:antialiased}' +
    '@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .gma{--a-bg:#fff;--a-card:#f3f1ec;--a-line:#e2dfd7;--a-fg:#15141a;--a-fg2:#5d5b66;--a-acc:#c4501a;--a-on:#fff;--a-bad:#c8321f}}' +
    ':root[data-theme="light"] .gma{--a-bg:#fff;--a-card:#f3f1ec;--a-line:#e2dfd7;--a-fg:#15141a;--a-fg2:#5d5b66;--a-acc:#c4501a;--a-on:#fff;--a-bad:#c8321f}' +
    ':root[data-theme="dark"] .gma{--a-bg:#1b1b23;--a-card:#23232d;--a-line:#30303c;--a-fg:#f1efe9;--a-fg2:#a3a1ad;--a-acc:#fd9b65;--a-on:#1a0f08;--a-bad:#ff7a6b}' +
    '.gma *{box-sizing:border-box}.gma button,.gma input{font:inherit}' +
    '.gma-in{height:36px;border:0;border-radius:999px;padding:0 14px;background:var(--a-acc);color:var(--a-on);font-weight:600;cursor:pointer;white-space:nowrap}' +
    '.gma-me{height:36px;border:1px solid var(--a-line);border-radius:999px;padding:0 10px 0 4px;background:var(--a-card);color:var(--a-fg);display:flex;align-items:center;gap:7px;cursor:pointer;max-width:12rem}' +
    '.gma-me i{flex:none;width:28px;height:28px;border-radius:50%;background:var(--a-acc);color:var(--a-on);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:13px;text-transform:uppercase}' +
    '.gma-me span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}' +
    '@media (max-width:520px){.gma-me{padding:0 4px}.gma-me span{display:none}}' +
    '.gma-menu{position:absolute;right:0;top:calc(100% + 8px);z-index:80;min-width:220px;background:var(--a-bg);color:var(--a-fg);border:1px solid var(--a-line);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.35);padding:6px}' +
    '.gma-menu .hd{padding:8px 10px 10px;border-bottom:1px solid var(--a-line);margin-bottom:4px}.gma-menu .hd b{display:block;font-size:15px}.gma-menu .hd small{color:var(--a-fg2)}' +
    '.gma-menu a,.gma-menu button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--a-fg);padding:9px 10px;border-radius:9px;text-decoration:none;cursor:pointer;font-size:14px}' +
    '.gma-menu a:hover,.gma-menu button:hover{background:var(--a-card)}.gma-menu .out{color:var(--a-bad)}.gma-menu hr{border:0;border-top:1px solid var(--a-line);margin:4px 0}' +
    '.gma-dlg{border:0;border-radius:16px;padding:0;width:min(380px,calc(100vw - 32px));background:var(--a-bg);color:var(--a-fg);box-shadow:0 30px 80px rgba(0,0,0,.45)}' +
    '.gma-dlg::backdrop{background:rgba(8,8,12,.55)}' +
    '.gma-dlg form{padding:22px;display:flex;flex-direction:column;gap:12px}.gma-dlg h3{margin:0;font-size:21px;letter-spacing:-.01em}.gma-dlg p{margin:0;color:var(--a-fg2);font-size:13px}' +
    '.gma-dlg label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--a-fg2)}' +
    '.gma-dlg input{height:44px;border:1px solid var(--a-line);border-radius:10px;background:var(--a-card);color:var(--a-fg);padding:0 12px;font-size:16px;outline:none}.gma-dlg input:focus{border-color:var(--a-acc)}' +
    '.gma-dlg .err{color:var(--a-bad);min-height:1.2em;font-size:13px}' +
    '.gma-dlg .row{display:flex;gap:8px;justify-content:flex-end}.gma-dlg .row button{height:42px;border:0;border-radius:10px;padding:0 16px;font-weight:600;cursor:pointer}' +
    '.gma-dlg .ok{background:var(--a-acc);color:var(--a-on)}.gma-dlg .no{background:var(--a-card);color:var(--a-fg)}.gma-dlg .ok:disabled{opacity:.5}';

  function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function set(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  var token = get(K.token), me = null;
  try { me = JSON.parse(get(K.me) || 'null'); } catch (e) {}
  if (!token) { token = get(K.cal) || get(K.torneo) || get(K.agenda) || null; me = null; }

  // Copia la sesión a las claves de cada programa (así todos ven la misma cuenta)
  function sync() {
    set(K.token, token); set(K.me, me ? JSON.stringify(me) : null);
    var acct = me && me.kind === 'account';
    set(K.cal, acct ? token : null);
    set(K.agenda, me && me.admin ? token : null);
    set(K.torneo, me && me.player ? token : null);
    set(K.torneoMe, me && me.player ? JSON.stringify(me.player) : null);
  }
  function clearAll() { token = null; me = null; sync(); EXTRA.forEach(function (k) { set(k, null); }); try { sessionStorage.removeItem('gm-torneo-admin'); } catch (e) {} }

  function call(method, path, body, tok) {
    var h = { 'Content-Type': 'application/json' }; if (tok) h.Authorization = 'Bearer ' + tok;
    return fetch(API + path, { method: method, headers: h, body: body ? JSON.stringify(body) : undefined, cache: 'no-store' })
      .catch(function () { var e = new Error('Sin conexión con el servidor.'); e.net = true; throw e; })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) { var e = new Error(j.error || 'Algo falló.'); e.status = r.status; throw e; } return j; }); });
  }

  if (!document.getElementById('gma-css')) { var st = document.createElement('style'); st.id = 'gma-css'; st.textContent = CSS; document.head.appendChild(st); }
  var slot = null, menuOpen = false;

  function links() {
    var l = [];
    if (me && me.kind === 'account') l.push(['/calorias/', 'Calorías']);
    if (me && me.admin) { l.push(['/agenda/', 'Agenda']); l.push(['/asistente/', 'Asistente']); }
    if (me && me.player) l.push(['/sudoku/torneo/', 'Torneo de sudoku']);
    if (me && me.admin) l.push(['/admin/', 'Panel de admin']);
    return l;
  }
  function render() {
    slot = slot || document.getElementById('gmAuth');
    if (!slot) return;
    slot.className = 'gma';
    if (!token || !me) { slot.innerHTML = '<button class="gma-in" type="button">Entrar</button>'; slot.firstChild.onclick = open; return; }
    var sub = me.admin ? 'Admin' : me.kind === 'player' ? 'Jugador del torneo' : 'Cuenta';
    if (me.player && me.kind === 'account' && me.player.name.toLowerCase() !== me.name.toLowerCase()) sub += ' · en el torneo: ' + me.player.name;
    slot.innerHTML = '<button class="gma-me" type="button" aria-haspopup="menu" aria-expanded="false"><i>' + esc(me.name.charAt(0)) + '</i><span>' + esc(me.name) + '</span></button>' +
      '<div class="gma-menu" role="menu" hidden><div class="hd"><b>' + esc(me.name) + '</b><small>' + esc(sub) + '</small></div>' +
      links().map(function (x) { return '<a role="menuitem" href="' + x[0] + '">' + esc(x[1]) + '</a>'; }).join('') +
      '<hr>' + (me.kind === 'account' ? '<button type="button" role="menuitem" data-pw>Cambiar contraseña</button>' : '') +
      '<button type="button" role="menuitem" class="out" data-out>Salir</button></div>';
    var btn = slot.querySelector('.gma-me'), menu = slot.querySelector('.gma-menu');
    btn.onclick = function (e) { e.stopPropagation(); menuOpen = menu.hidden; menu.hidden = !menuOpen; btn.setAttribute('aria-expanded', String(menuOpen)); };
    menu.querySelector('[data-out]').onclick = function () { logout(); };
    var pw = menu.querySelector('[data-pw]'); if (pw) pw.onclick = function () { menu.hidden = true; password(); };
  }
  document.addEventListener('click', function (e) { if (!slot) return; var m = slot.querySelector('.gma-menu'); if (m && !m.hidden && !slot.contains(e.target)) m.hidden = true; });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && slot) { var m = slot.querySelector('.gma-menu'); if (m) m.hidden = true; } });

  function dialog(html, onSubmit) {
    var d = document.createElement('dialog'); d.className = 'gma-dlg';
    var wrap = document.createElement('div'); wrap.className = 'gma'; wrap.style.display = 'block';
    d.innerHTML = '<form novalidate>' + html + '<p class="err" role="alert"></p><div class="row"><button class="no" type="button">Cancelar</button><button class="ok" type="submit">Entrar</button></div></form>';
    wrap.appendChild(d); document.body.appendChild(wrap);
    var f = d.querySelector('form'), err = d.querySelector('.err'), ok = d.querySelector('.ok');
    d.querySelector('.no').onclick = function () { d.close(); };
    d.addEventListener('close', function () { wrap.remove(); });
    f.onsubmit = function (e) {
      e.preventDefault(); err.textContent = ''; ok.disabled = true;
      Promise.resolve(onSubmit(f)).then(function (close) { if (close !== false) d.close(); }, function (x) { err.textContent = x.message; }).then(function () { ok.disabled = false; });
    };
    d.showModal(); var first = d.querySelector('input'); if (first) first.focus();
    return d;
  }
  function login(user, password) {
    return call('POST', '/login', { user: user, password: password }).then(function (r) {
      token = r.token; me = { kind: r.kind, name: r.name, admin: r.admin, player: r.player };
      sync(); location.reload(); return me;
    });
  }
  function open() {
    var d = dialog('<h3>Entrar</h3><p>Una cuenta para todo el sitio. Si solo jugás al torneo, usá tu apodo y PIN.</p>' +
      '<label>Usuario o apodo<input name="u" autocomplete="username" autocapitalize="none" spellcheck="false"></label>' +
      '<label>Contraseña o PIN<input name="p" type="password" autocomplete="current-password"></label>', function (f) {
      return login(f.u.value, f.p.value);
    });
    return d;
  }
  function password() {
    var d = dialog('<h3>Cambiar contraseña</h3>' +
      '<label>Contraseña actual<input name="c" type="password" autocomplete="current-password"></label>' +
      '<label>Nueva (mínimo 8 caracteres)<input name="n" type="password" autocomplete="new-password"></label>' +
      '<label>Repetila<input name="n2" type="password" autocomplete="new-password"></label>', function (f) {
      if (f.n.value.length < 8) throw new Error('La nueva contraseña tiene que tener al menos 8 caracteres.');
      if (f.n.value !== f.n2.value) throw new Error('Las contraseñas nuevas no coinciden.');
      return call('POST', '/password', { current: f.c.value, next: f.n.value }, token).then(function () { toast('Contraseña cambiada'); });
    });
    d.querySelector('.ok').textContent = 'Guardar';
  }
  function toast(t) {
    var el = document.createElement('div'); el.className = 'gma';
    el.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:90;display:block';
    el.innerHTML = '<div style="background:var(--a-fg);color:var(--a-bg);padding:10px 16px;border-radius:10px;font-size:14px">' + esc(t) + '</div>';
    document.body.appendChild(el); setTimeout(function () { el.remove(); }, 2600);
  }
  function logout() {
    var t = token; clearAll();
    var go = function () { location.reload(); };
    if (t) fetch(API + '/logout', { method: 'POST', headers: { Authorization: 'Bearer ' + t } }).then(go, go); else go();
  }

  // Validar la sesión con el servidor
  var ready = !token ? Promise.resolve(null) : call('GET', '/me', null, token).then(function (r) {
    var was = JSON.stringify(me); me = r; sync(); render();
    if (was !== JSON.stringify(me) && was !== 'null') document.dispatchEvent(new CustomEvent('gm-auth', { detail: me }));
    return me;
  }, function (e) {
    if (e.status === 401 || e.status === 403) { var had = !!me; clearAll(); render(); if (had) location.reload(); }
    return me;
  });
  if (token && me) sync();

  window.GMAuth = { me: function () { return token ? me : null; }, token: function () { return token; }, open: open, login: login, logout: logout, ready: ready };
  window.gmAccount = { get: function () { return token && me && me.player ? { token: token, me: { id: me.player.id, name: me.player.name } } : null; } };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', render); else render();
})();

</script>
<script>
/* Asistente: chat con herramientas. GMChat.mount({ mode: 'float' | 'page', el, token(), page, date(), onChange(kinds), onAuth() }) */
(function () {
  'use strict';
  if (window.GMChat) return;
  var API = '/api/sudoku/asistente';
  var HKEY = 'gm-chat-v1';
  var CSS = '' +
    '.gmc{--c-bg:#15151c;--c-card:#1f1f28;--c-card2:#272732;--c-line:#30303c;--c-fg:#f1efe9;--c-fg2:#a3a1ad;--c-fg3:#72707d;--c-acc:#fd9b65;--c-on:#1a0f08;--c-me:#2c2c38;--c-ok:#6fd59a;--c-bad:#ff7a6b;--c-add:#123524;--c-del:#3b1717;' +
    'font-family:"Inter Tight",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;color:var(--c-fg);-webkit-font-smoothing:antialiased;font-variant-numeric:normal}' +
    '@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .gmc{--c-bg:#ffffff;--c-card:#f6f5f1;--c-card2:#eeece6;--c-line:#e2dfd7;--c-fg:#15141a;--c-fg2:#5d5b66;--c-fg3:#8d8a95;--c-acc:#c4501a;--c-on:#fff;--c-me:#f0eee8;--c-ok:#1f8a52;--c-bad:#c8321f;--c-add:#e3f5e9;--c-del:#fbe4e1}}' +
    ':root[data-theme="light"] .gmc{--c-bg:#ffffff;--c-card:#f6f5f1;--c-card2:#eeece6;--c-line:#e2dfd7;--c-fg:#15141a;--c-fg2:#5d5b66;--c-fg3:#8d8a95;--c-acc:#c4501a;--c-on:#fff;--c-me:#f0eee8;--c-ok:#1f8a52;--c-bad:#c8321f;--c-add:#e3f5e9;--c-del:#fbe4e1}' +
    '.gmc *{box-sizing:border-box}.gmc button,.gmc textarea{font:inherit;color:inherit}.gmc button{cursor:pointer}' +
    '.gmc-fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:60;width:56px;height:56px;border-radius:50%;border:0;background:var(--c-acc);color:var(--c-on);display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.3)}' +
    '.gmc-fab:hover{transform:translateY(-1px)}' +
    '.gmc-panel{display:flex;flex-direction:column;background:var(--c-bg);min-height:0}' +
    '.gmc.float .gmc-panel{position:fixed;z-index:61;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:min(420px,calc(100vw - 36px));height:min(680px,calc(100dvh - 36px));border:1px solid var(--c-line);border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.4);overflow:hidden}' +
    '@media (max-width:560px){.gmc.float .gmc-panel{inset:0;width:auto;height:auto;border-radius:0;border:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}}' +
    '.gmc.page .gmc-panel{height:100%}' +
    '.gmc-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--c-line)}' +
    '.gmc-head b{font-size:16px;flex:1}.gmc-head small{color:var(--c-fg3);font-size:12px}' +
    '.gmc-ib{border:0;background:var(--c-card);border-radius:10px;height:34px;min-width:34px;padding:0 10px;display:grid;place-items:center;font-size:13px;color:var(--c-fg2)}.gmc-ib:hover{color:var(--c-fg)}' +
    '.gmc-log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain}' +
    '.gmc-m{max-width:88%;padding:9px 12px;border-radius:14px;white-space:normal;overflow-wrap:anywhere}' +
    '.gmc-m.user{align-self:flex-end;background:var(--c-me);border-bottom-right-radius:4px}' +
    '.gmc-m.assistant{align-self:flex-start;background:var(--c-card);border-bottom-left-radius:4px}' +
    '.gmc-m.err{align-self:flex-start;background:transparent;border:1px solid var(--c-bad);color:var(--c-bad)}' +
    '.gmc-m p{margin:0}.gmc-m p+p,.gmc-m ul+p,.gmc-m p+ul{margin-top:6px}.gmc-m ul{margin:4px 0 0;padding-left:18px}.gmc-m code{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--c-card2);padding:1px 4px;border-radius:4px}' +
    '.gmc-acts{display:flex;flex-direction:column;gap:3px;margin-top:6px}.gmc-acts span{font-size:12.5px;color:var(--c-fg2)}.gmc-acts span::before{content:"✓ ";color:var(--c-ok);font-weight:700}' +
    '.gmc-step{align-self:flex-start;color:var(--c-fg3);font-size:13px;display:flex;align-items:center;gap:8px}' +
    '.gmc-step i{width:14px;height:14px;border-radius:50%;border:2px solid var(--c-line);border-top-color:var(--c-acc);animation:gmcspin .8s linear infinite}' +
    '@keyframes gmcspin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.gmc-step i{animation:none}}' +
    '.gmc-empty{color:var(--c-fg3);font-size:14px;margin:auto 0;text-align:center;padding:20px}' +
    '.gmc-empty b{display:block;color:var(--c-fg);font-size:17px;margin-bottom:6px}' +
    '.gmc-sugs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}.gmc-sugs button{border:1px solid var(--c-line);background:var(--c-card);border-radius:999px;padding:7px 12px;font-size:13px;color:var(--c-fg2)}.gmc-sugs button:hover{color:var(--c-fg)}' +
    '.gmc-site{border:1px solid var(--c-acc);border-radius:14px;padding:10px 12px;background:var(--c-card)}' +
    '.gmc-site b{display:block;margin-bottom:4px}.gmc-site pre{margin:6px 0 0;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.35;white-space:pre-wrap;overflow-wrap:anywhere;max-height:260px;overflow:auto;background:var(--c-bg);border-radius:8px;padding:8px}' +
    '.gmc-site pre .a{background:var(--c-add);display:block}.gmc-site pre .d{background:var(--c-del);display:block}.gmc-site pre .h{color:var(--c-fg3);display:block}' +
    '.gmc-site .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}' +
    '.gmc-btn{border:0;border-radius:10px;height:36px;padding:0 14px;background:var(--c-acc);color:var(--c-on);font-weight:600;font-size:14px}.gmc-btn.ghost{background:var(--c-card2);color:var(--c-fg)}.gmc-btn:disabled{opacity:.5;cursor:default}' +
    '.gmc-in{display:flex;gap:8px;align-items:flex-end;padding:10px 12px;border-top:1px solid var(--c-line)}' +
    '.gmc-in textarea{flex:1;min-width:0;resize:none;max-height:160px;min-height:42px;border:1px solid var(--c-line);border-radius:12px;background:var(--c-card);padding:10px 12px;font-size:16px;line-height:1.35;outline:none}' +
    '.gmc-in textarea:focus{border-color:var(--c-acc)}' +
    '.gmc-send{flex:none;width:42px;height:42px;border:0;border-radius:12px;background:var(--c-acc);color:var(--c-on);display:grid;place-items:center}.gmc-send:disabled{opacity:.45;cursor:default}' +
    '.gmc-note{font-size:12px;color:var(--c-fg3);padding:0 14px 8px}';
  var ICON_CHAT = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 10.5h7M8.5 14h4.5"/></svg>';
  var ICON_SEND = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg>';
  var ICON_X = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  var SUGS = {
    'calorías': ['Comí 2 empanadas de carne y una coca zero', '¿Cómo vengo hoy con las proteínas?', 'Pesé 96,1 kg hoy'],
    'agenda': ['Agregá estudiar análisis mañana de 10 a 12', 'Pasá las tareas pendientes a mañana', '¿Qué tengo hoy?'],
    'asistente': ['Almorcé milanesa con puré', 'Mañana a las 18 gimnasio, todos los días hábiles', 'Agregá a la portada un link a mi Instagram']
  };

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function md(s) {
    var lines = esc(s).split('\n'), out = [], list = null;
    lines.forEach(function (l) {
      l = l.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>');
      var m = /^\s*(?:[-*•]|\d+[.)])\s+(.*)$/.exec(l);
      if (m) { if (!list) { list = []; } list.push('<li>' + m[1] + '</li>'); return; }
      if (list) { out.push('<ul>' + list.join('') + '</ul>'); list = null; }
      if (l.trim()) out.push('<p>' + l.replace(/^#+\s*/, '') + '</p>');
    });
    if (list) out.push('<ul>' + list.join('') + '</ul>');
    return out.join('');
  }
  function load() { try { var h = JSON.parse(localStorage.getItem(HKEY) || '[]'); return Array.isArray(h) ? h : []; } catch (e) { return []; } }
  function save(h) { try { localStorage.setItem(HKEY, JSON.stringify(h.slice(-60))); } catch (e) {} }

  function mount(o) {
    if (!document.getElementById('gmc-css')) { var st = document.createElement('style'); st.id = 'gmc-css'; st.textContent = CSS; document.head.appendChild(st); }
    var root = document.createElement('div');
    root.className = 'gmc ' + (o.mode === 'page' ? 'page' : 'float');
    var history = load(), busy = false, site = null, info = null, siteMsg = '';
    root.innerHTML = (o.mode === 'page' ? '' : '<button class="gmc-fab" type="button" aria-label="Abrir el asistente">' + ICON_CHAT + '</button>') +
      '<section class="gmc-panel" role="dialog" aria-label="Asistente"' + (o.mode === 'page' ? '' : ' hidden') + '>' +
      '<div class="gmc-head"><b>Asistente</b><small class="gmc-use"></small><button class="gmc-ib gmc-new" type="button">Nueva</button>' +
      (o.mode === 'page' ? '' : '<button class="gmc-ib gmc-close" type="button" aria-label="Cerrar">' + ICON_X + '</button>') + '</div>' +
      '<div class="gmc-log" aria-live="polite"></div>' +
      '<form class="gmc-in"><textarea rows="1" placeholder="Pedime algo…" aria-label="Mensaje"></textarea><button class="gmc-send" type="submit" aria-label="Enviar">' + ICON_SEND + '</button></form>' +
      '</section>';
    (o.el || document.body).appendChild(root);
    var q = function (s) { return root.querySelector(s); };
    var panel = q('.gmc-panel'), log = q('.gmc-log'), ta = q('textarea'), send = q('.gmc-send');

    function call(method, p, body) {
      var h = { 'Content-Type': 'application/json' }, t = o.token && o.token();
      if (t) h.Authorization = 'Bearer ' + t;
      return fetch(API + p, { method: method, headers: h, body: body ? JSON.stringify(body) : undefined })
        .catch(function () { throw new Error('Sin conexión con el servidor.'); })
        .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) { var e = new Error(j.error || 'Algo falló (' + r.status + ').'); e.status = r.status; throw e; } return j; }); });
    }
    function scroll() { log.scrollTop = log.scrollHeight; }
    function render(step) {
      var h = '';
      if (!history.length && !step) {
        var sg = SUGS[o.page] || SUGS.asistente;
        h = '<div class="gmc-empty"><b>¿Qué hacemos?</b>Cargo comidas, armo tu agenda o cambio cosas del sitio.<div class="gmc-sugs">' +
          sg.map(function (s) { return '<button type="button" data-sug="' + esc(s) + '">' + esc(s) + '</button>'; }).join('') + '</div></div>';
      }
      history.forEach(function (m) {
        h += '<div class="gmc-m ' + (m.err ? 'err' : m.role) + '">' + (m.role === 'user' ? '<p>' + esc(m.content).replace(/\n/g, '<br>') + '</p>' : md(m.content)) +
          (m.actions && m.actions.length ? '<div class="gmc-acts">' + m.actions.map(function (a) { return '<span>' + esc(a.text) + '</span>'; }).join('') + '</div>' : '') + '</div>';
      });
      if (step) h += '<div class="gmc-step"><i></i>' + esc(step) + '</div>';
      if (site && site.pending) {
        var diff = String(site.diff || '').split('\n').map(function (l) {
          var c = /^\+(?!\+\+)/.test(l) ? 'a' : /^-(?!--)/.test(l) ? 'd' : /^(@@|diff |index |\+\+\+|---)/.test(l) ? 'h' : '';
          return '<span' + (c ? ' class="' + c + '"' : '') + '>' + (esc(l) || ' ') + '</span>';
        }).join('');
        h += '<div class="gmc-site"><b>Cambios en el sitio, sin publicar</b><span style="font-size:13px;color:var(--c-fg2)">' + esc(site.stat.split('\n').pop().trim()) + '</span>' +
          '<details><summary style="cursor:pointer;font-size:13px;margin-top:6px">Ver cambios</summary><pre>' + diff + (site.truncated ? '\n…' : '') + '</pre></details>' +
          '<div class="row"><button class="gmc-btn" type="button" data-pub>Publicar</button><button class="gmc-btn ghost" type="button" data-disc>Descartar</button></div></div>';
      } else if (site && site.published) {
        h += '<div class="gmc-site"><b>Publicado</b><span style="font-size:13px;color:var(--c-fg2)">Se ve en el sitio en un minuto, más o menos.</span><div class="row"><button class="gmc-btn ghost" type="button" data-undo>Deshacer</button></div></div>';
      }
      log.innerHTML = h; scroll();
    }
    function usage() { q('.gmc-use').textContent = info ? info.used + '/' + info.limit + ' hoy' : ''; }
    function refreshStatus() {
      return call('GET', '/status').then(function (r) {
        info = r; usage();
        if (r.site && r.site.pending) site = r.site; else if (site && site.pending) site = null;
        if (!r.enabled) { history.length || (log.innerHTML = '<div class="gmc-empty"><b>Falta la clave</b>Hay que cargar OPENROUTER_API_KEY en el servidor.</div>'); }
        else if (!busy) render();
      }).catch(function (e) {
        if (e.status === 401) { log.innerHTML = '<div class="gmc-empty"><b>Entrá primero</b>' + esc(e.message) + '</div>'; if (o.onAuth) o.onAuth(); }
      });
    }
    function poll(id) {
      return new Promise(function (resolve, reject) {
        var fails = 0;
        (function tick() {
          call('GET', '/job/' + id).then(function (j) {
            if (j.done) return resolve(j);
            render(j.step || 'Pensando…'); setTimeout(tick, 900);
          }).catch(function (e) { if (++fails > 4 || e.status === 404 || e.status === 401) reject(e); else setTimeout(tick, 1500); });
        })();
      });
    }
    function submit(text) {
      text = String(text || '').trim(); if (!text || busy) return;
      busy = true; send.disabled = true; ta.value = ''; grow();
      if (site && site.published) site = null;
      history.push({ role: 'user', content: text }); save(history); render('Pensando…');
      siteMsg = text.slice(0, 100);
      var msgs = history.filter(function (m) { return !m.err; }).map(function (m) {
        var c = m.content; if (m.actions && m.actions.length) c += '\n\n[Hecho: ' + m.actions.map(function (a) { return a.text; }).join('; ') + ']';
        return { role: m.role, content: c };
      });
      call('POST', '/chat', { messages: msgs, page: o.page, date: o.date ? o.date() : '' })
        .then(function (r) { return poll(r.job); })
        .then(function (j) {
          if (j.error) history.push({ role: 'assistant', content: j.error, err: true });
          else history.push({ role: 'assistant', content: j.reply, actions: j.actions });
          if (j.site) site = j.site.pending ? j.site : null;
          var kinds = {}; (j.actions || []).forEach(function (a) { kinds[a.kind] = true; });
          if (o.onChange && Object.keys(kinds).length) { try { o.onChange(kinds); } catch (e) {} }
        })
        .catch(function (e) { history.push({ role: 'assistant', content: e.message, err: true }); })
        .then(function () { save(history); busy = false; send.disabled = false; render(); if (info) { info.used++; usage(); } if (o.mode === 'page' || !panel.hidden) ta.focus(); });
    }
    function grow() { ta.style.height = 'auto'; ta.style.height = Math.min(160, ta.scrollHeight) + 'px'; }
    ta.addEventListener('input', grow);
    ta.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && !('ontouchstart' in window && matchMedia('(pointer:coarse)').matches)) { e.preventDefault(); submit(ta.value); } });
    q('form').addEventListener('submit', function (e) { e.preventDefault(); submit(ta.value); });
    log.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      if (b.dataset.sug) return submit(b.dataset.sug);
      if (b.hasAttribute('data-pub') || b.hasAttribute('data-disc') || b.hasAttribute('data-undo')) {
        b.disabled = true;
        var p = b.hasAttribute('data-pub') ? call('POST', '/site/publish', { message: siteMsg || 'cambio pedido por chat' }).then(function () { site = { published: true }; })
          : b.hasAttribute('data-disc') ? call('POST', '/site/discard').then(function () { site = null; history.push({ role: 'assistant', content: 'Descarté los cambios.' }); save(history); })
          : call('POST', '/site/undo').then(function (r) { site = null; history.push({ role: 'assistant', content: 'Deshice "' + r.undone + '". Se ve en un minuto.' }); save(history); });
        p.catch(function (err) { history.push({ role: 'assistant', content: err.message, err: true }); save(history); }).then(render);
      }
    });
    q('.gmc-new').addEventListener('click', function () { if (busy) return; history = []; save(history); render(); ta.focus(); });
    function open() { panel.hidden = false; if (fab) fab.hidden = true; render(); refreshStatus(); setTimeout(function () { ta.focus(); }, 30); }
    function close() { panel.hidden = true; if (fab) fab.hidden = false; }
    var fab = q('.gmc-fab');
    if (fab) {
      fab.addEventListener('click', open);
      q('.gmc-close').addEventListener('click', close);
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !panel.hidden) close(); });
    } else { render(); refreshStatus(); }
    return { open: open, close: close, refresh: refreshStatus, el: root };
  }
  window.GMChat = { mount: mount };
})();

</script>
<script>
(function () {
  'use strict';
  var KEY = 'gm-agenda-token';
  var $ = function (id) { return document.getElementById(id); };
  var token = null, chat = null;
  try { token = localStorage.getItem(KEY); } catch (e) {}
  function today() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function show(app) {
    $('loginView').hidden = app; $('chatBox').hidden = !app;
    if (app && !chat) chat = GMChat.mount({ mode: 'page', el: $('chatBox'), page: 'asistente', token: function () { return token; }, date: today, onAuth: function () { logout(true); } });
    if (app && chat) chat.refresh();
    if (!app) setTimeout(function () { $('lUser').focus(); }, 30);
  }
  function logout(expired) {
    if (!expired && token) fetch('/api/sudoku/logout', { method: 'POST', headers: { Authorization: 'Bearer ' + token } }).catch(function () {});
    token = null; try { localStorage.removeItem(KEY); } catch (e) {}
    $('lErr').textContent = expired ? 'Tu sesión venció. Volvé a entrar.' : '';
    show(false);
  }
  $('logout').addEventListener('click', function () { logout(false); });
  $('loginView').addEventListener('submit', function (e) {
    e.preventDefault(); $('lErr').textContent = ''; $('lBtn').disabled = true;
    GMAuth.login($('lUser').value, $('lPass').value)
      .then(function (r) { if (!r.admin) throw new Error('El asistente es solo para la cuenta de admin.'); })
      .catch(function (err) { $('lErr').textContent = err.message === 'Failed to fetch' ? 'Sin conexión.' : err.message; })
      .then(function () { $('lBtn').disabled = false; });
  });

  var root = document.documentElement, mq = window.matchMedia('(prefers-color-scheme: light)');
  var MOON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
  var SUN = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>';
  function theme() { var t = root.getAttribute('data-theme'); return t === 'dark' || t === 'light' ? t : (mq.matches ? 'light' : 'dark'); }
  function paint() { var d = theme() === 'dark'; $('themeBtn').innerHTML = d ? SUN : MOON; $('themeBtn').setAttribute('aria-label', d ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'); }
  $('themeBtn').addEventListener('click', function () { var n = theme() === 'dark' ? 'light' : 'dark'; root.setAttribute('data-theme', n); try { localStorage.setItem('gm-theme', n); } catch (e) {} paint(); });
  if (mq.addEventListener) mq.addEventListener('change', paint);
  paint();

  show(!!token);
  var gm = window.GMAuth && GMAuth.me(); if (!token && gm && !gm.admin) $('lErr').textContent = 'El asistente es solo para la cuenta de admin.';
})();
</script>
