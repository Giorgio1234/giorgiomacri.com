<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Giorgio Macri</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0f0f14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap">
<script>try{var t=localStorage.getItem('gm-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<style>
/* Layout: catálogo estilo arcade. Barra con pestañas y buscador; titular; tarjetas de categoría; grilla "Empezá acá";
   una fila por categoría. Las portadas son planchas de los colores de la marca (persimmon, sage, candle, blush, azul). */
:root {
  --bg: #0f0f14;
  --bg-2: #16161d;
  --card: #1b1b23;
  --card-hover: #23232d;
  --line: #2a2a35;
  --fg: #f1efe9;
  --fg-2: #a3a1ad;
  --fg-3: #6d6b78;
  --accent: #fd9b65;
  --on-accent: #1a0f08;
  --live: #6fd59a;
  --kbd: #2a2a35;
  /* portadas */
  --c-persimmon: #fd9b65;
  --c-sage: #9ac8ae;
  --c-candle: #f8f5d1;
  --c-blush: #e9d1c7;
  --c-blue: #004b82;
  --c-ink: #0f0f14;
  --font: 'Inter Tight', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --wrap: 1200px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f6f5f1; --bg-2: #efede7; --card: #ffffff; --card-hover: #f3f1ec; --line: #e2dfd7;
    --fg: #15141a; --fg-2: #5d5b66; --fg-3: #8d8a95; --accent: #c4501a; --on-accent: #ffffff; --live: #1f8a52; --kbd: #e7e4dc;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f6f5f1; --bg-2: #efede7; --card: #ffffff; --card-hover: #f3f1ec; --line: #e2dfd7;
  --fg: #15141a; --fg-2: #5d5b66; --fg-3: #8d8a95; --accent: #c4501a; --on-accent: #ffffff; --live: #1f8a52; --kbd: #e7e4dc;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font); font-size: 16px; line-height: 1.4;
  font-feature-settings: "tnum" on; -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
[hidden] { display: none !important; }
.skip { position: absolute; left: -9999px; top: 8px; background: var(--accent); color: var(--on-accent); padding: 8px 12px; z-index: 30; }
.skip:focus { left: 16px; }

.wrap {
  max-width: var(--wrap); margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- Barra ---------- */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); }
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.top-in { display: flex; align-items: center; gap: 14px; min-height: 60px; flex-wrap: wrap; padding-block: 8px; }
.mark { display: flex; align-items: baseline; gap: 2px; font-weight: 700; font-size: 19px; letter-spacing: -0.02em; text-decoration: none; white-space: nowrap; }
.mark span { color: var(--accent); }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button {
  border: 0; background: none; color: var(--fg-2); padding: 7px 12px; border-radius: 999px; white-space: nowrap; font-weight: 500; font-size: 15px;
}
.tabs button:hover { color: var(--fg); background: var(--card); }
.tabs button[aria-pressed="true"] { color: var(--fg); background: var(--card-hover); }
.tools { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.search {
  display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 10px;
  padding: 0 10px; height: 40px; width: 260px; max-width: 100%;
}
.search:focus-within { border-color: var(--fg-3); }
.search svg { flex: none; color: var(--fg-3); }
.search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 15px; }
.search input::placeholder { color: var(--fg-3); }
kbd { font: 12px/1 var(--font); background: var(--kbd); color: var(--fg-2); border-radius: 5px; padding: 4px 6px; }
.btn {
  height: 40px; border: 0; border-radius: 10px; padding: 0 14px; background: var(--accent); color: var(--on-accent); font-weight: 600; white-space: nowrap;
}
.btn:hover { filter: brightness(1.06); }
.icon-btn { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; padding: 0; color: var(--fg-2); }
.icon-btn:hover { color: var(--fg); background: var(--card-hover); }
@media (max-width: 760px) {
  .top-in { gap: 10px; }
  .tabs { order: 3; width: 100%; margin-inline: -4px; }
  .tools { flex: 1 1 0; min-width: 0; justify-content: flex-end; }
  .search { width: auto; flex: 1 1 120px; min-width: 0; }
  .search kbd { display: none; }
  .btn .long { display: none; }
}

/* ---------- Titular ---------- */
.hero { padding-block: 44px 26px; }
.hero h1 { margin: 0; font-size: clamp(36px, 6.2vw, 72px); line-height: .98; letter-spacing: -0.035em; font-weight: 700; max-width: 14ch; text-wrap: balance; }
.hero p { margin: 14px 0 0; color: var(--fg-2); font-size: clamp(17px, 1.6vw, 20px); }

/* ---------- Seguí donde estabas ---------- */
.resume { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 30px; }
.resume a {
  display: flex; align-items: center; gap: 10px; text-decoration: none; background: var(--card); border: 1px solid var(--line);
  border-radius: 12px; padding: 10px 14px; min-width: 0;
}
.resume a:hover { background: var(--card-hover); }
.resume b { font-weight: 600; }
.resume small { color: var(--fg-2); font-size: 14px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--live); flex: none; animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }

/* ---------- Categorías ---------- */
.cats { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 12px; margin-bottom: 46px; }
.cat {
  display: flex; flex-direction: column; gap: 14px; text-decoration: none; background: var(--card); border: 1px solid var(--line);
  border-radius: 16px; padding: 14px; text-align: left; width: 100%;
}
.cat:hover { background: var(--card-hover); }
.cat-thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.cat-thumbs .cover { border-radius: 8px; aspect-ratio: 1; }
.cat-thumbs .empty { border-radius: 8px; aspect-ratio: 1; border: 1px dashed var(--line); }
.cat-meta { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
.cat h3 { margin: 0; font-size: 20px; letter-spacing: -0.01em; }
.cat p { margin: 2px 0 0; color: var(--fg-2); font-size: 14px; }
.count { color: var(--fg-3); font-size: 14px; white-space: nowrap; }

/* ---------- Secciones ---------- */
section.sec { margin-bottom: 46px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.sec-head h2 { margin: 0; font-size: 24px; letter-spacing: -0.02em; font-weight: 700; }
.see { border: 0; background: none; color: var(--fg-2); padding: 0; font-size: 15px; text-decoration: underline; text-underline-offset: 3px; }
.see:hover { color: var(--fg); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 18px 14px; }
.rail { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(200px, 240px); gap: 14px; overflow-x: auto; scroll-snap-type: x proximity; padding-bottom: 8px; scrollbar-width: thin; }
.rail > * { scroll-snap-align: start; }

.item { display: flex; flex-direction: column; gap: 10px; text-decoration: none; min-width: 0; }
.item .cover { border-radius: 14px; aspect-ratio: 4 / 3; transition: transform .2s ease, box-shadow .2s ease; }
.item:hover .cover { transform: translateY(-3px); box-shadow: 0 14px 30px rgba(0, 0, 0, .35); }
.item h3 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
.item p { margin: 2px 0 0; color: var(--fg-2); font-size: 14px; }
.item .row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.item .tag { color: var(--fg-3); font-size: 13px; white-space: nowrap; }
.item .live { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 13px; color: var(--live); }
.item .live .dot { width: 7px; height: 7px; }
.none { color: var(--fg-2); padding: 30px 0; }

/* Portadas */
.cover { position: relative; overflow: hidden; display: block; width: 100%; max-width: 100%; }
.cover svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* ---------- Pie ---------- */
.foot { border-top: 1px solid var(--line); background: var(--bg-2); margin-top: 20px; }
.foot-in { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 26px; padding-block: 32px calc(32px + env(safe-area-inset-bottom, 0px)); }
.foot h4 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--fg-3); font-weight: 600; }
.foot ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.foot a, .foot button { color: var(--fg-2); text-decoration: none; background: none; border: 0; padding: 0; text-align: left; }
.foot a:hover, .foot button:hover { color: var(--fg); }
.foot .big { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; color: var(--fg); }
.foot .muted { color: var(--fg-3); font-size: 14px; margin-top: 8px; }

@media (prefers-reduced-motion: reduce) {
  .item .cover, .dot { transition: none; animation: none; }
}
</style>
</head>
<body>
<a class="skip" href="#contenido">Saltar al contenido</a>

<header class="top">
  <div class="wrap top-in">
    <a class="mark" href="/" aria-label="giorgiomacri.com, inicio">giorgiomacri<span>/</span></a>
    <nav class="tabs" id="tabs" aria-label="Categorías"></nav>
    <div class="tools">
      <label class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="q" type="search" autocomplete="off" aria-label="Buscar">
        <kbd>/</kbd>
      </label>
      <button class="btn" type="button" id="surprise"><span class="long">Sorprendeme</span><span aria-hidden="true"> ↗</span></button>
      <button class="icon-btn" type="button" id="themeBtn" aria-label="Cambiar tema"></button>
      <span id="gmAuth"></span>
    </div>
  </div>
</header>

<main id="contenido" class="wrap">
  <div class="hero">
    <h1>Utilidades</h1>
    <p id="tagline"></p>
  </div>

  <div class="resume" id="resume" hidden></div>

  <div id="home">
    <div class="cats" id="cats"></div>
    <section class="sec">
      <div class="sec-head"><h2>Empezá acá</h2></div>
      <div class="grid" id="start"></div>
    </section>
    <div id="rows"></div>
  </div>

  <section class="sec" id="filtered" hidden>
    <div class="sec-head"><h2 id="fTitle"></h2><button class="see" type="button" id="fBack">Ver todo</button></div>
    <div class="grid" id="fGrid"></div>
  </section>
</main>

<footer class="foot">
  <div class="wrap foot-in">
    <div>
      <div class="big">giorgiomacri<span style="color:var(--accent)">/</span></div>
      <p class="muted" id="footCount"></p>
    </div>
    <div>
      <h4>Elegí una categoría</h4>
      <ul id="footCats"></ul>
    </div>
    <div>
      <h4>Todo</h4>
      <ul id="footAll"></ul>
    </div>
  </div>
  <div class="wrap" style="padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); color: var(--fg-3); font-size: 13px;">© 2026 Giorgio Macri</div>
</footer>

<script>
(function () {
  'use strict';

  /* =====================================================================
     CATÁLOGO. Para agregar algo nuevo, sumá un objeto a ITEMS.
     - cat: una de las claves de CATS
     - art: 'sudoku' | 'trophy' | 'table' | 'ring' | cualquier otra cosa (portada con la inicial)
     - color: persimmon | sage | candle | blush | blue | ink
     - featured: aparece en "Empezá acá"
     ===================================================================== */
  var CATS = {
    juegos:       { name: 'Juegos', sub: 'Sudoku libre y el torneo semanal con amigos' },
    herramientas: { name: 'Herramientas', sub: 'Cosas útiles para estudiar, trabajar y la mesa de poker' }
  };
  var ITEMS = [
    { id: 'sudoku', name: 'Sudoku', url: '/sudoku/', cat: 'juegos', tag: 'Juego', desc: 'Cinco dificultades, notas y pistas.', art: 'sudoku', color: 'candle', featured: true, keywords: 'puzzle numeros libre' },
    { id: 'torneo', name: 'Torneo semanal', url: '/sudoku/torneo/', cat: 'juegos', tag: 'Sudoku', desc: 'Un Experto por día. Gana el menor tiempo.', art: 'trophy', color: 'persimmon', featured: true, keywords: 'competencia amigos ranking experto' },
    { id: 'posiciones', name: 'Posiciones', url: '/sudoku/posiciones/', cat: 'juegos', tag: 'Sudoku', desc: 'La tabla del torneo, en vivo.', art: 'table', color: 'blush', featured: false, keywords: 'tabla ranking scoreboard campeones' },
    { id: 'pomodoro', name: 'Pomodoro', url: '/pomodoro/', cat: 'herramientas', tag: 'Herramienta', desc: 'Foco y descansos, con registro del día.', art: 'ring', color: 'sage', featured: true, keywords: 'timer temporizador estudio concentracion' },
    { id: 'poker', name: 'Deudas de poker', url: '/poker/', cat: 'herramientas', tag: 'Herramienta', desc: 'Quién le paga a quién al final de la noche.', art: 'cards', color: 'blue', featured: true, keywords: 'poker deudas cuentas fichas plata calculadora' },
    { id: 'agenda', name: 'Agenda', url: '/agenda/', cat: 'herramientas', tag: 'Privada', desc: 'Mi día: bloques, prioridades, tareas y hábitos.', art: 'calendar', color: 'candle', featured: false, keywords: 'agenda planner diario calendario tareas habitos organizacion' },
    { id: 'calorias', name: 'Calorías', url: '/calorias/', cat: 'herramientas', tag: 'Con cuenta', desc: 'Comidas, macros y peso. Describí lo que comiste.', art: 'macros', color: 'sage', featured: false, keywords: 'calorias macros dieta nutricion comida peso proteinas contador diario' },
    { id: 'asistente', name: 'Asistente', url: '/asistente/', cat: 'herramientas', tag: 'Privada', desc: 'Le pido cosas y las carga: comidas, agenda, el sitio.', art: 'chat', color: 'blush', featured: false, keywords: 'asistente chat ia bot inteligencia artificial ayuda' }
  ];
  var PALETTE = { persimmon: '#fd9b65', sage: '#9ac8ae', candle: '#f8f5d1', blush: '#e9d1c7', blue: '#004b82', ink: '#0f0f14' };

  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function plural(n, a, b) { return n + ' ' + (n === 1 ? a : b); }

  /* ---------- Portadas (SVG generado, sin imágenes) ---------- */
  function inkFor(color) { return color === 'blue' || color === 'ink' ? '#f8f5d1' : '#0f0f14'; }
  function art(item) {
    var bg = PALETTE[item.color] || PALETTE.persimmon, ink = inkFor(item.color), s = '';
    var W = 400, H = 300;
    if (item.art === 'sudoku') {
      var x0 = 110, y0 = 40, c = 20, given = [5, 0, 0, 0, 7, 0, 0, 0, 9, 0, 3, 0, 1, 0, 0, 6, 0, 0, 0, 0, 8, 0, 0, 2, 0, 4, 0, 4, 0, 0, 0, 6, 0, 0, 0, 1, 0, 7, 0, 3, 0, 9, 0, 5, 0, 2, 0, 0, 0, 8, 0, 0, 0, 7, 0, 6, 0, 5, 0, 0, 3, 0, 0, 0, 0, 1, 0, 0, 4, 0, 9, 0, 8, 0, 0, 0, 2, 0, 0, 0, 6];
      s += '<rect x="' + (x0 + 3 * c) + '" y="' + (y0 + 4 * c) + '" width="' + c + '" height="' + c + '" fill="#fd9b65" opacity=".9"/>';
      for (var i = 0; i <= 9; i++) {
        var w = i % 3 === 0 ? 2.4 : .8;
        s += '<line x1="' + x0 + '" y1="' + (y0 + i * c) + '" x2="' + (x0 + 9 * c) + '" y2="' + (y0 + i * c) + '" stroke="' + ink + '" stroke-width="' + w + '"/>';
        s += '<line x1="' + (x0 + i * c) + '" y1="' + y0 + '" x2="' + (x0 + i * c) + '" y2="' + (y0 + 9 * c) + '" stroke="' + ink + '" stroke-width="' + w + '"/>';
      }
      given.forEach(function (d, k) {
        if (!d) return;
        s += '<text x="' + (x0 + (k % 9) * c + c / 2) + '" y="' + (y0 + Math.floor(k / 9) * c + c * .72) + '" text-anchor="middle" font-family="Inter Tight, sans-serif" font-size="13" font-weight="500" fill="' + ink + '">' + d + '</text>';
      });
    } else if (item.art === 'trophy') {
      // podio 2-1-3 con una grilla chica arriba
      var base = 250;
      [[90, 90, '2'], [160, 130, '1'], [230, 70, '3']].forEach(function (p) {
        s += '<rect x="' + p[0] + '" y="' + (base - p[1]) + '" width="64" height="' + p[1] + '" fill="' + ink + '"/>';
        s += '<text x="' + (p[0] + 32) + '" y="' + (base - p[1] + 44) + '" text-anchor="middle" font-family="Inter Tight, sans-serif" font-size="36" font-weight="700" fill="' + bg + '">' + p[2] + '</text>';
      });
      for (var r = 0; r <= 3; r++) {
        s += '<line x1="170" y1="' + (40 + r * 15) + '" x2="215" y2="' + (40 + r * 15) + '" stroke="' + ink + '" stroke-width="' + (r % 3 ? 1 : 2) + '"/>';
        s += '<line x1="' + (170 + r * 15) + '" y1="40" x2="' + (170 + r * 15) + '" y2="85" stroke="' + ink + '" stroke-width="' + (r % 3 ? 1 : 2) + '"/>';
      }
      s += '<line x1="40" y1="' + base + '" x2="360" y2="' + base + '" stroke="' + ink + '" stroke-width="2"/>';
    } else if (item.art === 'table') {
      var rows = [['1', 200, true], ['2', 160], ['3', 140], ['4', 110], ['5', 80]];
      rows.forEach(function (rw, k) {
        var y = 52 + k * 42;
        s += '<text x="80" y="' + (y + 22) + '" font-family="Inter Tight, sans-serif" font-size="22" font-weight="700" fill="' + ink + '">' + rw[0] + '</text>';
        s += '<rect x="115" y="' + (y + 4) + '" width="' + rw[1] + '" height="22" rx="3" fill="' + (rw[2] ? '#004b82' : ink) + '" opacity="' + (rw[2] ? 1 : .85 - k * .12) + '"/>';
      });
    } else if (item.art === 'ring') {
      var cx = 200, cy = 150, R = 92, C = 2 * Math.PI * R;
      s += '<circle cx="' + cx + '" cy="' + cy + '" r="' + R + '" fill="none" stroke="' + ink + '" stroke-opacity=".18" stroke-width="18"/>';
      s += '<circle cx="' + cx + '" cy="' + cy + '" r="' + R + '" fill="none" stroke="' + ink + '" stroke-width="18" stroke-linecap="round" stroke-dasharray="' + (C * .68).toFixed(1) + ' ' + C.toFixed(1) + '" transform="rotate(-90 ' + cx + ' ' + cy + ')"/>';
      s += '<text x="' + cx + '" y="' + (cy + 16) + '" text-anchor="middle" font-family="Inter Tight, sans-serif" font-size="46" font-weight="600" letter-spacing="-1" fill="' + ink + '">25:00</text>';
    } else if (item.art === 'calendar') {
      // hoja de agenda: líneas de hora y bloques de color
      s += '<rect x="96" y="40" width="208" height="224" rx="14" fill="#ffffff" stroke="#0f0f14" stroke-width="2"/>';
      s += '<rect x="96" y="40" width="208" height="40" rx="14" fill="#0f0f14"/><rect x="96" y="64" width="208" height="16" fill="#0f0f14"/>';
      s += '<text x="200" y="68" text-anchor="middle" font-family="Inter Tight, sans-serif" font-size="18" font-weight="700" fill="#f8f5d1">HOY</text>';
      for (var hr = 0; hr < 6; hr++) s += '<line x1="128" y1="' + (98 + hr * 28) + '" x2="290" y2="' + (98 + hr * 28) + '" stroke="#0f0f14" stroke-opacity=".15"/>' +
        '<text x="120" y="' + (102 + hr * 28) + '" text-anchor="end" font-family="Inter Tight, sans-serif" font-size="10" fill="#0f0f14" fill-opacity=".5">' + (8 + hr * 2) + '</text>';
      s += '<rect x="132" y="102" width="150" height="38" rx="6" fill="#fd9b65"/><rect x="132" y="158" width="110" height="22" rx="6" fill="#9ac8ae"/><rect x="132" y="206" width="134" height="40" rx="6" fill="#004b82"/>';
    } else if (item.art === 'chat') {
      // dos globos de conversación

  /* ---------- Estado en vivo leído de este navegador (mismo sitio) ---------- */

    $('footAll').innerHTML = ITEMS.map(function (i) { return '<li><a href="' + esc(i.url) + '">' + esc(i.name) + '</a></li>'; }).join('');
  }

  function setTab(t, scroll) {

  $('surprise').addEventListener('click', function () {
    var pick = ITEMS[Math.floor(Math.random() * ITEMS.length)];

  var root = document.documentElement, mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: light)') : null;

  var SUN = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>';
  function theme() { var t = root.getAttribute('data-theme'); return t === 'dark' || t === 'light' ? t : (mq && mq.matches ? 'light' : 'dark'); }

  $('themeBtn').addEventListener('click', function () {

  // Pestaña desde el link (#juegos, #herramientas)
  var h = location.hash.replace('#', '');
  current = CATS[h] ? h : 'todo';
  render();
  // Refresca solo las etiquetas "en vivo" (pomodoro corriendo, partidas en curso), sin redibujar el catálogo
  function liveKey() { return Object.keys(live).sort().join(',') + '|' + resumeLinks.length; }
  var lastKey = liveKey();
  function tick() {
    computeLive();
    var k = liveKey();
    if (k !== lastKey) { lastKey = k; render(); return; }
    document.querySelectorAll('[data-live]').forEach(function (el) {
      var v = live[el.getAttribute('data-live')];

  window.addEventListener('storage', render);

<script>

  function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  }

  var slot = null, menuOpen = false;

    btn.onclick = function (e) { e.stopPropagation(); menuOpen = menu.hidden; menu.hidden = !menuOpen; btn.setAttribute('aria-expanded', String(menuOpen)); };
    menu.querySelector('[data-out]').onclick = function () { logout(); };
    var pw = menu.querySelector('[data-pw]'); if (pw) pw.onclick = function () { menu.hidden = true; password(); };
  }
  document.addEventListener('click', function (e) { if (!slot) return; var m = slot.querySelector('.gma-menu'); if (m && !m.hidden && !slot.contains(e.target)) m.hidden = true; });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && slot) { var m = slot.querySelector('.gma-menu'); if (m) m.hidden = true; } });

  function dialog(html, onSubmit) {
    var d = document.createElement('dialog'); d.className = 'gma-dlg';
    var wrap = document.createElement('div'); wrap.className = 'gma'; wrap.style.display = 'block';
    d.innerHTML = '<form novalidate>' + html + '<p class="err" role="alert"></p><div class="row"><button class="no" type="button">Cancelar</button><button class="ok" type="submit">Entrar</button></div></form>';
    wrap.appendChild(d); document.body.appendChild(wrap);
    var f = d.querySelector('form'), err = d.querySelector('.err'), ok = d.querySelector('.ok');
    d.querySelector('.no').onclick = function () { d.close(); };
    d.addEventListener('close', function () { wrap.remove(); });
    f.onsubmit = function (e) {
      e.preventDefault(); err.textContent = ''; ok.disabled = true;
      Promise.resolve(onSubmit(f)).then(function (close) { if (close !== false) d.close(); }, function (x) { err.textContent = x.message; }).then(function () { ok.disabled = false; });
    };
    d.showModal(); var first = d.querySelector('input'); if (first) first.focus();
    return d;
  }
  function login(user, password) {
    return call('POST', '/login', { user: user, password: password }).then(function (r) {
      token = r.token; me = { kind: r.kind, name: r.name, admin: r.admin, player: r.player };
      sync(); location.reload(); return me;
    });
  }
  function open() {
    var d = dialog('<h3>Entrar</h3><p>Una cuenta para todo el sitio. Si solo jugás al torneo, usá tu apodo y PIN.</p>' +
      '<label>Usuario o apodo<input name="u" autocomplete="username" autocapitalize="none" spellcheck="false"></label>' +
      '<label>Contraseña o PIN<input name="p" type="password" autocomplete="current-password"></label>', function (f) {
      return login(f.u.value, f.p.value);
    });
    return d;
  }
  function password() {
    var d = dialog('<h3>Cambiar contraseña</h3>' +
      '<label>Contraseña actual<input name="c" type="password" autocomplete="current-password"></label>' +
      '<label>Nueva (mínimo 8 caracteres)<input name="n" type="password" autocomplete="new-password"></label>' +
      '<label>Repetila<input name="n2" type="password" autocomplete="new-password"></label>', function (f) {
      if (f.n.value.length < 8) throw new Error('La nueva contraseña tiene que tener al menos 8 caracteres.');
      if (f.n.value !== f.n2.value) throw new Error('Las contraseñas nuevas no coinciden.');
      return call('POST', '/password', { current: f.c.value, next: f.n.value }, token).then(function () { toast('Contraseña cambiada'); });
    });
    d.querySelector('.ok').textContent = 'Guardar';
  }
  function toast(t) {
    var el = document.createElement('div'); el.className = 'gma';
    el.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:90;display:block';
    el.innerHTML = '<div style="background:var(--a-fg);color:var(--a-bg);padding:10px 16px;border-radius:10px;font-size:14px">' + esc(t) + '</div>';
    document.body.appendChild(el); setTimeout(function () { el.remove(); }, 2600);
  }
  function logout() {
    var t = token; clearAll();
    var go = function () { location.reload(); };
    if (t) fetch(API + '/logout', { method: 'POST', headers: { Authorization: 'Bearer ' + t } }).then(go, go); else go();
  }

  // Validar la sesión con el servidor
  var ready = !token ? Promise.resolve(null) : call('GET', '/me', null, token).then(function (r) {
    var was = JSON.stringify(me); me = r; sync(); render();
    if (was !== JSON.stringify(me) && was !== 'null') document.dispatchEvent(new CustomEvent('gm-auth', { detail: me }));
    return me;
  }, function (e) {
    if (e.status === 401 || e.status === 403) { var had = !!me; clearAll(); render(); if (had) location.reload(); }
    return me;
  });
  if (token && me) sync();

  window.GMAuth = { me: function () { return token ? me : null; }, token: function () { return token; }, open: open, login: login, logout: logout, ready: ready };
  window.gmAccount = { get: function () { return token && me && me.player ? { token: token, me: { id: me.player.id, name: me.player.name } } : null; } };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', render); else render();
})();

</script>
</body>
</html>
