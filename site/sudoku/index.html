<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sudoku</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap">
<script>try{var t=localStorage.getItem('gm-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<style>
/* ===== Base compartida: libre, torneo y admin ===== */
:root {
  --navy: #344861;
  --blue: #325aaf;
  --blue-btn: #5a7bc0;
  --blue-btn-hover: #4b6db4;
  --sel: #bbdefb;
  --peer: #e2ebf3;
  --same: #c3d7ea;
  --line: #bec6d4;
  --red: #e55c6c;
  --red-soft: #f7cfd6;
  --tile: #eaeef4;
  --tile-hover: #dce3ed;
  --muted: #94a3b7;
  --text-2: #6e7c8c;
  --bg: #ffffff;
  --panel: #f3f6fa;
  --green: #2f8f5b;
  --grid: #344861;
  --surface: #ffffff;
  --border: #e3e8ef;
  --border-soft: #eef1f5;
  --me-row: #f2f7fd;
  --locked-tile: #f7f9fb;
  --veil: rgba(255, 255, 255, .96);
  --overlay: rgba(52, 72, 97, .45);
  --shadow: rgba(52, 72, 97, .3);
  --on-accent: #ffffff;
  --inverse-bg: #344861;
  --inverse-fg: #ffffff;
  --badge-off: #b8c2cf;
  --ok-bg: #e3f3ea;
  --bad-bg: #fbe5e9;
  --warn-bg: #fdf0d5;
  --warn-fg: #8a5a00;
  --info-bg: #dce8f6;
  --purple-bg: #efe6f7;
  --purple-fg: #6b3fa0;
  --flash-row: #fff6d6;
  --font: 'Inter Tight', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: light;
}
/* Tema oscuro: sigue al sistema salvo que el usuario elija con el botón (data-theme) */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --navy: #dbe3ee; --blue: #8ab0ff; --blue-btn: #4f74c2; --blue-btn-hover: #5d82cf;
    --sel: #2d4b74; --peer: #1d2632; --same: #2a3b54; --line: #333e4d;
    --red: #ff7a89; --red-soft: #4b2229; --tile: #222a36; --tile-hover: #2b3543;
    --muted: #7d8b9e; --text-2: #a5b1c1; --bg: #11151c; --panel: #19202a; --green: #55c991;
    --grid: #8a98ab; --surface: #171c25; --border: #2a3340; --border-soft: #222a35; --me-row: #1c2635;
    --locked-tile: #151a22; --veil: rgba(17, 21, 28, .95); --overlay: rgba(0, 0, 0, .6); --shadow: rgba(0, 0, 0, .5);
    --on-accent: #ffffff; --inverse-bg: #dbe3ee; --inverse-fg: #11151c; --badge-off: #4a5566;
    --ok-bg: #173226; --bad-bg: #3d1d23; --warn-bg: #3a2e14; --warn-fg: #f0c46a; --info-bg: #1d2c45;
    --purple-bg: #2c2140; --purple-fg: #c3a3f0; --flash-row: #3a3418;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --navy: #dbe3ee; --blue: #8ab0ff; --blue-btn: #4f74c2; --blue-btn-hover: #5d82cf;
  --sel: #2d4b74; --peer: #1d2632; --same: #2a3b54; --line: #333e4d;
  --red: #ff7a89; --red-soft: #4b2229; --tile: #222a36; --tile-hover: #2b3543;
  --muted: #7d8b9e; --text-2: #a5b1c1; --bg: #11151c; --panel: #19202a; --green: #55c991;
  --grid: #8a98ab; --surface: #171c25; --border: #2a3340; --border-soft: #222a35; --me-row: #1c2635;
  --locked-tile: #151a22; --veil: rgba(17, 21, 28, .95); --overlay: rgba(0, 0, 0, .6); --shadow: rgba(0, 0, 0, .5);
  --on-accent: #ffffff; --inverse-bg: #dbe3ee; --inverse-fg: #11151c; --badge-off: #4a5566;
  --ok-bg: #173226; --bad-bg: #3d1d23; --warn-bg: #3a2e14; --warn-fg: #f0c46a; --info-bg: #1d2c45;
  --purple-bg: #2c2140; --purple-fg: #c3a3f0; --flash-row: #3a3418;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--navy);
  font-family: var(--font); font-size: 16px; line-height: 1.35;
  font-feature-settings: "tnum" on; -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; cursor: pointer; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
[hidden] { display: none !important; }

/* Barra superior */
.nav { border-bottom: 1px solid var(--border); background: var(--bg); }
.nav-in {
  max-width: 880px; margin: 0 auto; display: flex; align-items: stretch; gap: 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-height: 64px;
}
.brand { display: flex; align-items: center; font-size: 26px; font-weight: 600; letter-spacing: -0.02em; color: var(--navy); text-decoration: none; }
.tabs { display: flex; gap: 22px; }
.tabs a { display: flex; align-items: center; color: var(--text-2); text-decoration: none; font-weight: 500; border-bottom: 2px solid transparent; padding-top: 2px; }
.tabs a[aria-current="page"] { color: var(--blue); border-bottom-color: var(--blue); }
.tabs a:hover { color: var(--blue); }
.nav-right { margin-left: auto; display: flex; align-items: center; gap: 14px; font-size: 14px; color: var(--text-2); }
.nav-right a { color: var(--text-2); }
@media (max-width: 560px) {
  .nav-in { gap: 16px; min-height: 56px; }
  .brand { font-size: 21px; }
  .tabs { gap: 14px; }
  .nav-right .home { display: none; }
}

.page {
  max-width: 880px; margin: 0 auto; padding-block: 18px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Botones genéricos */
.btn {
  border: 0; border-radius: 6px; background: var(--blue-btn); color: var(--on-accent); font-weight: 500;
  padding: 12px 18px; line-height: 1.1; font-size: 16px;
}
.btn:hover { background: var(--blue-btn-hover); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.ghost { background: var(--tile); color: var(--navy); }
.btn.ghost:hover { background: var(--tile-hover); }
.btn.danger { background: var(--red); }
.btn.small { padding: 8px 12px; font-size: 14px; }
.link { background: none; border: 0; padding: 0; color: var(--blue); text-decoration: underline; text-underline-offset: 3px; font-size: 14px; }

/* Fila de dificultades */
.diffbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; margin: 0 0 14px; font-size: 15px; }
.diffbar span { color: var(--muted); }
@media (max-width: 560px) {
  .diffbar { flex-wrap: nowrap; overflow-x: auto; gap: 14px; scrollbar-width: none; }
  .diffbar span { display: none; }
  .diffbar button { white-space: nowrap; }
}
.diffbar button { border: 0; background: none; padding: 4px 0; color: var(--text-2); font-weight: 500; }
.diffbar button:hover { color: var(--blue); }
.diffbar button[aria-pressed="true"] { color: var(--blue); }

/* Avisos */
.banner { border-radius: 8px; padding: 14px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; background: var(--panel); }
.banner p { margin: 0; flex: 1 1 16rem; }
.banner.ok { background: var(--ok-bg); }
.banner.bad { background: var(--bad-bg); }

/* ===== Tablero ===== */
.sg {
  display: grid; justify-content: center; gap: 14px 24px;
  grid-template-columns: minmax(0, 500px);
  grid-template-areas: "stats" "board" "tools" "keys" "foot";
}
.sg-stats { grid-area: stats; }
.sg-board-wrap { grid-area: board; position: relative; align-self: start; }
.sg-tools { grid-area: tools; }
.sg-keys { grid-area: keys; }
.sg-foot { grid-area: foot; display: flex; flex-direction: column; gap: 10px; }
@media (min-width: 820px) {
  .sg {
    grid-template-columns: 500px 320px;
    grid-template-rows: auto auto auto auto 1fr;
    grid-template-areas: "board stats" "board tools" "board keys" "board foot" "board .";
  }
}

.sg-stats { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.sg-stat { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.sg-stat:first-child { align-items: flex-start; }
.sg-stat:last-child { align-items: flex-end; }
.sg-stat small { color: var(--muted); font-size: 14px; white-space: nowrap; }
.sg-stat b { font-weight: 500; font-size: 17px; white-space: nowrap; }
.sg-stat b.bad { color: var(--red); }
.sg-time { display: flex; align-items: center; gap: 8px; }
.sg-pause {
  width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--tile); color: var(--text-2);
  display: grid; place-items: center; padding: 0;
}
.sg-pause:hover { background: var(--tile-hover); }

.sg-board {
  display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); grid-template-rows: repeat(9, minmax(0, 1fr));
  aspect-ratio: 1; width: 100%;
  border: 2px solid var(--grid); background: var(--surface); container-type: inline-size;
  user-select: none; -webkit-user-select: none;
}
.sg-cell {
  position: relative; display: grid; place-items: center;
  border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
  font-size: 7cqi; line-height: 1; color: var(--navy); cursor: pointer;
  aspect-ratio: 1; min-width: 0; min-height: 0; overflow: hidden;
}
.sg-cell.c8 { border-right: 0; } .sg-cell.r8 { border-bottom: 0; }
.sg-cell.tr { border-right: 2px solid var(--grid); }
.sg-cell.tb { border-bottom: 2px solid var(--grid); }
.sg-cell.user { color: var(--blue); }
.sg-cell.wrong { color: var(--red); }
.sg-cell.peer { background: var(--peer); }
.sg-cell.same { background: var(--same); }
.sg-cell.sel { background: var(--sel); }
.sg-cell.wrong.sel, .sg-cell.wrong.same { background: var(--red-soft); }
.sg-cell.flash { animation: flash .5s ease; }
@keyframes flash { 0% { background: var(--red-soft); } 100% { } }
.sg-notes { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); width: 100%; height: 100%; padding: 4% 6%; }
.sg-notes span { display: grid; place-items: center; font-size: 2.35cqi; color: var(--text-2); line-height: 1; }
.sg-notes span.hl { color: var(--blue); font-weight: 600; }
.sg-veil {
  position: absolute; inset: 0; display: grid; place-items: center; background: var(--veil);
  border: 2px solid var(--grid); text-align: center; padding: 24px;
}
.sg-veil-in { display: flex; flex-direction: column; align-items: center; gap: 12px; max-width: 22rem; }
.sg-veil p { margin: 0; }
.sg-play {
  width: 72px; height: 72px; border-radius: 50%; border: 0; background: var(--blue-btn); color: var(--on-accent);
  display: grid; place-items: center;
}

/* Herramientas */
.sg-tools { display: grid; grid-template-columns: repeat(var(--tools, 4), 1fr); justify-items: center; }
.sg-tool { border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--text-2); font-size: 13px; }
.sg-tool .ico {
  position: relative; width: 56px; height: 56px; border-radius: 50%; background: var(--tile);
  display: grid; place-items: center; color: var(--blue); transition: background .15s;
}
.sg-tool:hover .ico { background: var(--tile-hover); }
.sg-tool:disabled { opacity: .4; cursor: default; }
.sg-badge {
  position: absolute; top: -6px; right: -10px; min-width: 22px; height: 20px; padding: 0 6px;
  border-radius: 999px; border: 2px solid var(--surface); background: var(--badge-off); color: var(--on-accent);
  font-size: 11px; font-weight: 600; line-height: 16px; text-align: center;
}
.sg-badge.on { background: var(--blue); }
.sg-tool.pencil[aria-pressed="true"] .ico { background: var(--sel); }

/* Teclado */
.sg-keys { display: grid; grid-template-columns: repeat(9, 1fr); }
.sg-key {
  border: 0; background: none; color: var(--blue); padding: 0;
  font-size: clamp(30px, 9vw, 46px); font-weight: 400; line-height: 1; height: 64px; border-radius: 6px;
}
.sg-key:active { background: var(--tile); }
.sg-key.gone { visibility: hidden; }
.sg-key:disabled { opacity: .4; cursor: default; }
.sg-key:disabled:hover { background: var(--tile); }
.sg.pencil-on .sg-key { color: var(--text-2); font-size: clamp(22px, 6vw, 32px); }
@media (min-width: 820px) {
  .sg-keys { grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .sg-key { background: var(--tile); height: auto; aspect-ratio: 1.05; font-size: 40px; }
  .sg-key:hover { background: var(--tile-hover); }
  .sg.pencil-on .sg-key { font-size: 28px; }
}
@media (hover: hover) and (pointer: fine) { .sg-key:hover { background: var(--tile); } }
.sg-foot .btn { width: 100%; padding: 16px; font-size: 17px; }
.sg-hint-text { margin: 0; font-size: 13px; color: var(--muted); text-align: center; }
@media (hover: none) { .sg-hint-text { display: none; } }

/* Celulares angostos: las pestañas alcanzan, sin el logo */
@media (max-width: 430px) {
  .brand { display: none; }
  .tabs { gap: 16px; }
}

/* Cartel especial por IP */
.notice-veil {
  position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
  background: var(--overlay);
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.notice-card {
  width: min(440px, 100%); background: var(--surface); border-radius: 12px; padding: 24px;
  display: flex; flex-direction: column; gap: 18px; box-shadow: 0 20px 60px var(--shadow);
}
.notice-card p { margin: 0; font-size: 20px; line-height: 1.35; white-space: pre-line; overflow-wrap: anywhere; }
.notice-card .btn { align-self: flex-end; }

/* Sesión en la barra (Libre, Torneo, Posiciones) */
.nav-right .acct-name, .nav-right #who { max-width: 9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; color: var(--navy); }
.nav-right .acct-in { color: var(--blue); font-weight: 500; text-decoration: none; }
.nav-right .acct-in:hover { text-decoration: underline; text-underline-offset: 3px; }
@media (max-width: 430px) { .nav-right .acct-name, .nav-right #who { max-width: 5.5rem; } }

/* Botón de tema */
.theme-btn {
  align-self: center; flex: none; width: 36px; height: 36px; border-radius: 50%; border: 0;
  background: var(--tile); color: var(--text-2); display: grid; place-items: center; padding: 0;
}
.theme-btn:hover { background: var(--tile-hover); color: var(--navy); }
@media (max-width: 430px) {
  .theme-btn { width: 32px; height: 32px; }
  .tabs { gap: 12px; }
  .nav-in { gap: 12px; }
  .nav-right { gap: 8px; }
  .nav-right .acct-name, .nav-right #who { max-width: 4.5rem; }
}

.acct { margin: 0 0 10px; font-size: 13px; color: var(--muted); }
.acct a { color: var(--blue); }
</style>
</head>
<body>
<header class="nav">
  <div class="nav-in">
    <a class="brand" href="/sudoku/">Sudoku</a>
    <nav class="tabs" aria-label="Modo">
      <a href="/sudoku/" aria-current="page">Libre</a>
      <a href="/sudoku/torneo/">Torneo</a>
      <a href="/sudoku/posiciones/">Posiciones</a>
    </nav>
    <div class="nav-right"><span id="gmAuth"></span></div>
  </div>
</header>

<main class="page">
  <p class="acct" id="who" hidden></p>
  <div class="diffbar" id="diffs" role="group" aria-label="Dificultad"><span>Dificultad:</span></div>
  <div class="banner" id="confirm" hidden style="margin-bottom:14px">
    <p id="confirmText">¿Empezar un juego nuevo? Se pierde el actual.</p>
    <button class="btn small" type="button" id="yes">Sí, nuevo juego</button>
    <button class="btn small ghost" type="button" id="no">Seguir jugando</button>
  </div>
  <div id="game"></div>
</main>

<script>
/* Cuenta única de giorgiomacri.com: botón "Entrar" / menú de la cuenta arriba a la derecha (en #gmAuth).
 * Una sesión para todo: el token se copia a las claves que usan Sudoku, Calorías, Agenda y Asistente.
 * window.GMAuth: { me(), token(), open(), logout(), ready }  ·  window.gmAccount: compatibilidad con Sudoku. */
(function () {
  'use strict';
  if (window.GMAuth) return;
  var API = '/api/sudoku/auth';
  var K = { token: 'gm-token', me: 'gm-me', torneo: 'gm-torneo-token', torneoMe: 'gm-torneo-me', cal: 'gm-cal-token', agenda: 'gm-agenda-token' };
  var EXTRA = ['gm-cal-cache', 'gm-agenda-cache', 'gm-chat-v1'];
  var CSS = '' +
    '.gma{--a-bg:#1b1b23;--a-card:#23232d;--a-line:#30303c;--a-fg:#f1efe9;--a-fg2:#a3a1ad;--a-acc:#fd9b65;--a-on:#1a0f08;--a-bad:#ff7a6b;' +
    'font-family:"Inter Tight",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.35;position:relative;display:inline-flex;align-items:center;-webkit-font-smoothing:antialiased}' +
    '@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .gma{--a-bg:#fff;--a-card:#f3f1ec;--a-line:#e2dfd7;--a-fg:#15141a;--a-fg2:#5d5b66;--a-acc:#c4501a;--a-on:#fff;--a-bad:#c8321f}}' +
    ':root[data-theme="light"] .gma{--a-bg:#fff;--a-card:#f3f1ec;--a-line:#e2dfd7;--a-fg:#15141a;--a-fg2:#5d5b66;--a-acc:#c4501a;--a-on:#fff;--a-bad:#c8321f}' +
    ':root[data-theme="dark"] .gma{--a-bg:#1b1b23;--a-card:#23232d;--a-line:#30303c;--a-fg:#f1efe9;--a-fg2:#a3a1ad;--a-acc:#fd9b65;--a-on:#1a0f08;--a-bad:#ff7a6b}' +
    '.gma *{box-sizing:border-box}.gma button,.gma input{font:inherit}' +
    '.gma-in{height:36px;border:0;border-radius:999px;padding:0 14px;background:var(--a-acc);color:var(--a-on);font-weight:600;cursor:pointer;white-space:nowrap}' +
    '.gma-me{height:36px;border:1px solid var(--a-line);border-radius:999px;padding:0 10px 0 4px;background:var(--a-card);color:var(--a-fg);display:flex;align-items:center;gap:7px;cursor:pointer;max-width:12rem}' +
    '.gma-me i{flex:none;width:28px;height:28px;border-radius:50%;background:var(--a-acc);color:var(--a-on);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:13px;text-transform:uppercase}' +
    '.gma-me span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}' +
    '@media (max-width:520px){.gma-me{padding:0 4px}.gma-me span{display:none}}' +
    '.gma-menu{position:absolute;right:0;top:calc(100% + 8px);z-index:80;min-width:220px;background:var(--a-bg);color:var(--a-fg);border:1px solid var(--a-line);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.35);padding:6px}' +
    '.gma-menu .hd{padding:8px 10px 10px;border-bottom:1px solid var(--a-line);margin-bottom:4px}.gma-menu .hd b{display:block;font-size:15px}.gma-menu .hd small{color:var(--a-fg2)}' +
    '.gma-menu a,.gma-menu button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--a-fg);padding:9px 10px;border-radius:9px;text-decoration:none;cursor:pointer;font-size:14px}' +
    '.gma-menu a:hover,.gma-menu button:hover{background:var(--a-card)}.gma-menu .out{color:var(--a-bad)}.gma-menu hr{border:0;border-top:1px solid var(--a-line);margin:4px 0}' +
    '.gma-dlg{border:0;border-radius:16px;padding:0;width:min(380px,calc(100vw - 32px));background:var(--a-bg);color:var(--a-fg);box-shadow:0 30px 80px rgba(0,0,0,.45)}' +
    '.gma-dlg::backdrop{background:rgba(8,8,12,.55)}' +
    '.gma-dlg form{padding:22px;display:flex;flex-direction:column;gap:12px}.gma-dlg h3{margin:0;font-size:21px;letter-spacing:-.01em}.gma-dlg p{margin:0;color:var(--a-fg2);font-size:13px}' +
    '.gma-dlg label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--a-fg2)}' +

    if (toolBtns.undo) toolBtns.undo.addEventListener('click', undo);
    if (toolBtns.erase) toolBtns.erase.addEventListener('click', erase);
    if (toolBtns.pencil) toolBtns.pencil.addEventListener('click', function () { pencil = !pencil; render(); });
    if (toolBtns.hint) toolBtns.hint.addEventListener('click', hint);
    if (R.pause) R.pause.addEventListener('click', function () { if (!locked) api.setPaused(true); });

    function onKey(e) {
      if (!root.isConnected || root.offsetParent === null) return;
      if (e.target.closest && e.target.closest('input, select, textarea, dialog')) return;
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
      if (e.ctrlKey || e.metaKey || e.altKey || locked) return;
      var digit = 0;
      if (/^Digit[1-9]$/.test(e.code)) digit = +e.code.slice(5);
      else if (/^Numpad[1-9]$/.test(e.code)) digit = +e.code.slice(6);
      else if (/^[1-9]$/.test(e.key)) digit = +e.key;
      if (digit) {
        e.preventDefault();
        if (sel < 0) sel = 0;
        if (e.shiftKey) { var p = pencil; pencil = !p; input(digit); pencil = p; render(); } else input(digit);
        return;
      }
      if (e.key === 'Backspace' || e.key === 'Delete') { e.preventDefault(); erase(); return; }
      if (e.key === 'n' || e.key === 'N') { pencil = !pencil; render(); return; }
      var mv = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[e.key];
      if (mv) {
        e.preventDefault();
        if (sel < 0) sel = 40;
        else sel = ((((sel / 9) | 0) + mv[0] + 9) % 9) * 9 + ((sel % 9) + mv[1] + 9) % 9;
        render();
      }
    }
    document.addEventListener('keydown', onKey);

    var api = {
      load: function (s) {
        st.puzzle = s.puzzle.slice();
        st.values = s.values.slice();
        st.wrong = Object.assign({}, s.wrong || {});
        st.notes = (s.notes || []).slice(); for (var i = 0; i < 81; i++) st.notes[i] = st.notes[i] || 0;
        st.hintsLeft = s.hintsLeft != null ? s.hintsLeft : (opts.hints || 0);
        history = []; sel = -1; pencil = false; locked = false;
        render();
      },
      state: function () { return { puzzle: st.puzzle, values: st.values, wrong: st.wrong, notes: st.notes, hintsLeft: st.hintsLeft }; },
      setValue: function (i, d) { st.values[i] = d; render(); },
      stats: function (a, b, c) {
        [a, b, c].forEach(function (s, k) {
          if (!s) return;
          R['l' + k].textContent = s.label; R['v' + k].textContent = s.value;
          R['v' + k].classList.toggle('bad', !!s.bad);
        });
      },
      setLocked: function (v) { locked = v; if (v) sel = -1; render(); },
      // contenido: nodo o null para ocultar
      veil: function (node) { R.veil.hidden = !node; R.veilIn.innerHTML = ''; if (node) R.veilIn.appendChild(node); },
      setPaused: function (v) {
        if (!opts.pausable) return;
        paused = v; locked = v; render();
        if (v) {
          var wrap = document.createElement('div');
          wrap.innerHTML = '<button class="sg-play" type="button" aria-label="Seguir">' + ICON.play + '</button><p>Juego en pausa</p>';
          wrap.style.display = 'contents';
          wrap.querySelector('button').addEventListener('click', function () { api.setPaused(false); });
          api.veil(wrap);
        } else api.veil(null);
        if (opts.onPause) opts.onPause(v);
      },
      isPaused: function () { return paused; },
      footer: function (items) {
        R.foot.innerHTML = '';
        (items || []).forEach(function (it) {
          if (it.text) { var p = document.createElement('p'); p.className = 'sg-hint-text'; p.textContent = it.text; R.foot.appendChild(p); return; }
          var b = document.createElement('button');
          b.type = 'button'; b.className = 'btn' + (it.ghost ? ' ghost' : ''); b.textContent = it.label;
          b.addEventListener('click', it.onClick);
          R.foot.appendChild(b);
        });
      },
      destroy: function () { document.removeEventListener('keydown', onKey); }
    };
    if (opts.footer) api.footer(opts.footer);
    return api;
  }

  global.SudokuGame = SudokuGame;
})(window);

</script>
<script>
(function () {
  'use strict';
  var DIFFS = [
    { name: 'Muy fácil', clues: 46 },
    { name: 'Fácil', clues: 39 },
    { name: 'Media', clues: 33 },
    { name: 'Difícil', clues: 28 },
    { name: 'Experto', clues: 24 }
  ];
  var KEY = 'gm-sudoku-libre-v2';
  var S = null, chosen = 2, pending = null, tick = null;
  var $ = function (id) { return document.getElementById(id); };

  var game = SudokuGame($('game'), {
    tools: ['undo', 'erase', 'pencil', 'hint'],
    hints: 3,
    hideCompleted: true,
    pausable: true,
    validate: function (cell, d) {
      var ok = S.solution[cell] === d;
      if (!ok) S.mistakes++;
      return { correct: ok, after: function () { stats(); checkWin(); } };
    },
    hint: function (cell) { return S.solution[cell]; },
    afterHint: function () { checkWin(); },
    onChange: save,
    onPause: function () { stats(); },
    footer: [
      { label: 'Nuevo juego', onClick: function () { requestNew(chosen); } },
      { text: 'Teclado: números, flechas, Borrar, N para notas, Shift + número anota sin cambiar de modo.' }
    ]
  });

  DIFFS.forEach(function (df, k) {
    var b = document.createElement('button');
    b.type = 'button'; b.textContent = df.name; b.dataset.k = k;
    b.addEventListener('click', function () { requestNew(k); });
    $('diffs').appendChild(b);
  });

  /* Registro opcional en la cuenta del torneo (si entró en este navegador) */
  // Aviso discreto: con sesión se guardan las partidas; sin sesión, invitación a entrar
  function showWho() {
    var a = window.gmAccount && gmAccount.get(), w = $('who');
    w.hidden = false;
    if (a) w.textContent = 'Tus partidas se guardan en tu cuenta.';
    else { w.innerHTML = '<a href="#">Entrá</a> para guardar tus partidas.'; w.querySelector('a').onclick = function (e) { e.preventDefault(); if (window.GMAuth) GMAuth.open(); }; }
  }
  showWho();
  document.addEventListener('gm-account', showWho);
  function track(path, body) {
    var acct = window.gmAccount && gmAccount.get();
    if (!acct) return Promise.resolve(null);
    var dev = null; try { dev = localStorage.getItem('gm-device'); } catch (e) {}
    var h = { 'Content-Type': 'application/json', Authorization: 'Bearer ' + acct.token };
    if (dev) h['X-Device'] = dev;
    return fetch('/api/sudoku' + path, { method: 'POST', headers: h, body: JSON.stringify(body) })
      .then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
  }
  function fmt(s) { var m = (s / 60) | 0, x = s % 60; return (m < 10 ? '0' : '') + m + ':' + (x < 10 ? '0' : '') + x; }
  function stats() {
    if (!S) return;
    game.stats(
      { label: 'Dificultad', value: DIFFS[S.diff].name },
      { label: 'Errores', value: String(S.mistakes) },
      { label: 'Tiempo', value: fmt(S.elapsed) }
    );
    document.querySelectorAll('#diffs button').forEach(function (b) { b.setAttribute('aria-pressed', String(+b.dataset.k === chosen)); });
  }
  function save() {
    if (!S) return;
    var g = game.state();
    S.values = g.values; S.wrong = g.wrong; S.notes = g.notes; S.hintsLeft = g.hintsLeft;
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  }
  function load() {
    try { var s = JSON.parse(localStorage.getItem(KEY)); if (s && s.puzzle && s.puzzle.length === 81) return s; } catch (e) {}
    return null;
  }

  function startNew(k) {
    chosen = k;
    $('confirm').hidden = true;
    var g = SudokuGen.generate(DIFFS[k].clues);
    S = { diff: k, puzzle: g.puzzle, solution: g.solution, values: g.puzzle.slice(), wrong: {}, notes: [], hintsLeft: 3, mistakes: 0, elapsed: 0, won: false };
    track('/free/start', { difficulty: k }).then(function (r) { if (r && r.id && S && S.puzzle === g.puzzle) { S.freeId = r.id; save(); } });
    game.load(S); game.veil(null);
    stats(); save();
  }
  function inProgress() {
    if (!S || S.won) return false;
    var g = game.state();
    return S.mistakes > 0 || g.notes.some(Boolean) || g.values.some(function (v, i) { return v && !S.puzzle[i]; });
  }
  function requestNew(k) {
    if (inProgress()) {
      pending = k; chosen = k; stats();
      $('confirmText').textContent = '¿Empezar un juego nuevo en ' + DIFFS[k].name + '? Se pierde el actual.';
      $('confirm').hidden = false;
    } else startNew(k);
  }
  $('yes').addEventListener('click', function () { startNew(pending == null ? chosen : pending); });
  $('no').addEventListener('click', function () { $('confirm').hidden = true; chosen = S.diff; stats(); });

  function checkWin() {
    var v = game.state().values;
    for (var i = 0; i < 81; i++) if (v[i] !== S.solution[i]) return;
    S.won = true; save();
    if (S.freeId) track('/free/finish', { id: S.freeId, seconds: S.elapsed, mistakes: S.mistakes, hints: 3 - (game.state().hintsLeft || 0) });
    showWin();
  }
  function showWin() {
    game.setLocked(true);
    var box = document.createElement('div');
    box.style.display = 'contents';
    box.innerHTML = '<p style="font-size:26px;font-weight:600">¡Resuelto!</p><p></p>';
    box.lastChild.textContent = DIFFS[S.diff].name + ' · ' + fmt(S.elapsed) + ' · ' + S.mistakes + (S.mistakes === 1 ? ' error' : ' errores');
    var b = document.createElement('button');
    b.className = 'btn'; b.type = 'button'; b.textContent = 'Nuevo juego';
    b.addEventListener('click', function () { startNew(chosen); });
    box.appendChild(b);
    game.veil(box);
  }

  setInterval(function () {
    if (!S || S.won || game.isPaused() || document.hidden) return;
    S.elapsed++; stats();
    if (S.elapsed % 5 === 0) save();
  }, 1000);

  var saved = load();
  if (saved) {
    S = saved; chosen = S.diff;
    game.load(S); stats();
    if (S.won) showWin();
  } else startNew(2);
})();
</script>
<script>
/* Cartel especial por IP: el servidor decide si la IP de quien visita tiene un mensaje cargado desde el panel. */
(function () {
  'use strict';
  var dev = null;
  try {
    dev = localStorage.getItem('gm-device');
    if (!dev) {
      dev = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 12);
      localStorage.setItem('gm-device', dev);
    }
  } catch (e) {}
  var page = /\/posiciones\//.test(location.pathname) ? 'posiciones' : /\/torneo\//.test(location.pathname) ? 'torneo' : 'libre';
  fetch('/api/sudoku/notice?p=' + page, { cache: 'no-store', headers: dev ? { 'X-Device': dev } : {} })
    .then(function (r) { return r.ok ? r.json() : {}; })
    .then(function (j) {
      if (!j || !j.message) return;
      var SEEN = 'gm-notice-seen';
      if (!j.always) { try { if (localStorage.getItem(SEEN) === j.key) return; } catch (e) {} }
      var wrap = document.createElement('div');
      wrap.className = 'notice-veil';
      wrap.setAttribute('role', 'dialog');
      wrap.setAttribute('aria-modal', 'true');
      wrap.setAttribute('aria-labelledby', 'noticeText');
      wrap.innerHTML = '<div class="notice-card"><p id="noticeText"></p><button class="btn" type="button">Cerrar</button></div>';
      wrap.querySelector('p').textContent = j.message;
      function close() {
        if (!j.always) { try { localStorage.setItem(SEEN, j.key); } catch (e) {} }
        wrap.remove();
        document.removeEventListener('keydown', onKey, true);
      }
      function onKey(e) { if (e.key === 'Escape') { e.stopPropagation(); close(); } }
      wrap.querySelector('button').addEventListener('click', close);
      wrap.addEventListener('click', function (e) { if (e.target === wrap) close(); });
      document.addEventListener('keydown', onKey, true);
      document.body.appendChild(wrap);
      wrap.querySelector('button').focus();
    })
    .catch(function () {});
})();

</script>
<script>
/* Botón de tema claro/oscuro en la barra. Sin elección guardada, sigue al sistema. */
(function () {
  'use strict';
  var KEY = 'gm-theme', root = document.documentElement;
  var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  var MOON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
  var SUN = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>';

  function current() {
    var t = root.getAttribute('data-theme');
    if (t === 'dark' || t === 'light') return t;
    return mq && mq.matches ? 'dark' : 'light';
  }
  var nav = document.querySelector('.nav-in');
  if (!nav) return;
  var btn = document.createElement('button');
  btn.type = 'button'; btn.className = 'theme-btn';
  nav.appendChild(btn);

  function paint() {
    var dark = current() === 'dark';
    btn.innerHTML = dark ? SUN : MOON;
    btn.setAttribute('aria-label', dark ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro');
    btn.title = btn.getAttribute('aria-label');
  }
  btn.addEventListener('click', function () {
    var next = current() === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem(KEY, next); } catch (e) {}
    paint();
  });
  if (mq && mq.addEventListener) mq.addEventListener('change', paint);
  paint();
})();

</script>
