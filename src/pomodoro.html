<title>Pomodoro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&display=swap">
<script>try{var t=localStorage.getItem('gm-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<style>
/* Layout: una plancha de color a sangre por etapa (foco, corto, largo) con el tiempo como titular gigante; controles mínimos abajo. */
:root {
  --focus: #fd9b65;
  --short: #9ac8ae;
  --long: #f8f5d1;
  --ink: #000000;
  --ink-2: rgba(0, 0, 0, .62);
  --hair: rgba(0, 0, 0, .9);
  --action: #004b82;
  --on-action: #ffffff;
  --sheet: #ffffff;
  --sheet-line: rgba(0, 0, 0, .14);
  --field: var(--focus);
  --font: 'Inter Tight', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --gutter: clamp(16px, 5vw, 72px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --focus: #2a1a12; --short: #12211a; --long: #22200f;
    --ink: #f4ead9; --ink-2: rgba(244, 234, 217, .62); --hair: rgba(244, 234, 217, .85);
    --action: #fd9b65; --on-action: #1a110c; --sheet: #191714; --sheet-line: rgba(244, 234, 217, .14);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --focus: #2a1a12; --short: #12211a; --long: #22200f;
  --ink: #f4ead9; --ink-2: rgba(244, 234, 217, .62); --hair: rgba(244, 234, 217, .85);
  --action: #fd9b65; --on-action: #1a110c; --sheet: #191714; --sheet-line: rgba(244, 234, 217, .14);
  color-scheme: dark;
}
:root[data-mode="short"] { --field: var(--short); }
:root[data-mode="long"] { --field: var(--long); }

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--field); color: var(--ink);
  font-family: var(--font); font-size: 16px; line-height: 1.3; letter-spacing: 0.01em;
  font-feature-settings: "tnum" on, "ss01" on; -webkit-font-smoothing: antialiased;
  transition: background-color .6s ease;
}
@media (prefers-reduced-motion: reduce) { body, .bar span { transition: none !important; } }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
[hidden] { display: none !important; }

.app {
  min-height: 100%; display: grid; grid-template-rows: auto auto 1fr auto;
  padding-left: max(var(--gutter), env(safe-area-inset-left, 0px));
  padding-right: max(var(--gutter), env(safe-area-inset-right, 0px));
}

/* Barra de progreso: línea fina arriba de todo */
.bar { height: 3px; margin: 0 calc(-1 * max(var(--gutter), env(safe-area-inset-left, 0px))); background: transparent; }
.bar span { display: block; height: 100%; width: 0; background: var(--ink); transition: width .9s linear; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 24px; flex-wrap: wrap; }
.home { color: var(--ink); text-decoration: none; }
.home:hover { text-decoration: underline; text-underline-offset: 3px; }
.modes { display: flex; gap: 20px; }
.modes button { border: 0; background: none; padding: 4px 0; color: var(--ink-2); border-bottom: 1px solid transparent; }
.modes button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.icons { display: flex; gap: 6px; }
.icon { width: 40px; height: 40px; border: 0; background: none; display: grid; place-items: center; border-radius: 50%; color: var(--ink); padding: 0; }
.icon:hover { background: color-mix(in srgb, var(--ink) 8%, transparent); }

.main { display: flex; flex-direction: column; justify-content: center; gap: 18px; padding-block: 8px 24px; min-width: 0; }
.label { font-size: clamp(20px, 2.4vw, 32px); line-height: 1.2; }
.time {
  margin: 0; font-weight: 400; font-size: clamp(104px, 27vw, 340px); line-height: .8; letter-spacing: -0.035em;
  white-space: nowrap;
}
.task {
  width: min(100%, 36rem); border: 0; border-bottom: 1px solid var(--hair); background: transparent;
  padding: 10px 0; font-size: clamp(17px, 1.8vw, 22px); color: var(--ink); border-radius: 0;
}
.task::placeholder { color: var(--ink-2); }
.task:focus { outline: none; border-bottom-width: 2px; }

.controls { display: flex; align-items: center; gap: 18px; margin-top: 8px; }
.go {
  width: 76px; height: 76px; border-radius: 9999px; border: 0; background: var(--action); color: var(--on-action);
  display: grid; place-items: center; padding: 0; transition: transform .15s ease;
}
.go:active { transform: scale(.96); }
.line-btn { border: 0; background: none; padding: 8px 0; color: var(--ink); border-bottom: 1px solid var(--hair); }
.line-btn:hover { border-bottom-width: 2px; }

.foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px 24px; padding-block: 20px calc(24px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--hair); }
.dots { display: flex; align-items: center; gap: 8px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; border: 1px solid var(--ink); }
.dots i.on { background: var(--ink); }
.dots span { margin-left: 6px; }
.today { color: var(--ink-2); }

/* Ajustes */
dialog {
  border: 0; padding: 0; width: min(420px, calc(100vw - 32px)); background: var(--sheet); color: var(--ink);
  border-radius: 0; box-shadow: 0 30px 80px rgba(0, 0, 0, .35);
}
dialog::backdrop { background: rgba(0, 0, 0, .35); }
.sheet { padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.sheet h2 { margin: 0; font-size: 26px; font-weight: 400; letter-spacing: -0.01em; }
.nums { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.num { display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--ink-2); }
.num input { border: 0; border-bottom: 1px solid var(--hair); background: transparent; padding: 8px 0; font-size: 22px; color: var(--ink); width: 100%; border-radius: 0; }
.num input:focus { outline: none; border-bottom-width: 2px; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; border-top: 1px solid var(--sheet-line); }
.toggle input { width: 20px; height: 20px; accent-color: var(--action); }
.sheet-actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 4px; }
.pill { border: 0; border-radius: 9999px; background: var(--action); color: var(--on-action); padding: 12px 22px; }

.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--ink); color: var(--field); padding: 10px 16px; font-size: 14px; max-width: calc(100vw - 32px);
}

@media (max-width: 560px) {
  .top { padding-block: 16px; }
  .modes { gap: 14px; order: 3; width: 100%; }
  .go { width: 68px; height: 68px; }
}
</style>

<div class="app">
  <div class="bar" aria-hidden="true"><span id="bar"></span></div>

  <header class="top">
    <a class="home" href="/">© Giorgio Macri</a>
    <nav class="modes" id="modes" aria-label="Etapa">
      <button type="button" data-m="focus" aria-pressed="true">Foco</button>
      <button type="button" data-m="short" aria-pressed="false">Descanso corto</button>
      <button type="button" data-m="long" aria-pressed="false">Descanso largo</button>
    </nav>
    <div class="icons">
      <button class="icon" type="button" id="themeBtn" aria-label="Cambiar tema"></button>
      <button class="icon" type="button" id="settingsBtn" aria-label="Ajustes">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      </button>
    </div>
  </header>

  <main class="main">
    <div class="label" id="label">Foco</div>
    <h1 class="time" id="time" aria-live="off">25:00</h1>
    <input class="task" id="task" maxlength="80" placeholder="¿En qué vas a trabajar?" aria-label="Tarea">
    <div class="controls">
      <button class="go" type="button" id="go" aria-label="Empezar"></button>
      <button class="line-btn" type="button" id="reset">Reiniciar</button>
      <button class="line-btn" type="button" id="skip">Saltar</button>
    </div>
  </main>

  <footer class="foot">
    <div class="dots" id="dots" aria-label="Ciclo"></div>
    <div class="today" id="today"></div>
  </footer>
</div>

<dialog id="settings">
  <form class="sheet" id="settingsForm" method="dialog">
    <h2>Ajustes</h2>
    <div class="nums">
      <label class="num">Foco (min)<input id="sFocus" type="number" inputmode="numeric" min="1" max="180"></label>
      <label class="num">Descanso corto (min)<input id="sShort" type="number" inputmode="numeric" min="1" max="60"></label>
      <label class="num">Descanso largo (min)<input id="sLong" type="number" inputmode="numeric" min="1" max="90"></label>
      <label class="num">Largo cada (pomodoros)<input id="sEvery" type="number" inputmode="numeric" min="2" max="12"></label>
    </div>
    <div>
      <label class="toggle">Empezar los descansos solos<input id="sAutoBreak" type="checkbox"></label>
      <label class="toggle">Empezar el foco solo después del descanso<input id="sAutoFocus" type="checkbox"></label>
      <label class="toggle">Sonido al terminar<input id="sSound" type="checkbox"></label>
      <label class="toggle">Aviso del navegador al terminar<input id="sNotify" type="checkbox"></label>
    </div>
    <div class="sheet-actions">
      <button class="line-btn" type="button" id="sDefaults">Valores clásicos</button>
      <button class="pill" type="submit">Listo</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" hidden role="status"></div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var root = document.documentElement;
  var KEY = 'gm-pomodoro-v1';
  var NAMES = { focus: 'Foco', short: 'Descanso corto', long: 'Descanso largo' };
  var DEFAULTS = { focus: 25, short: 5, long: 15, every: 4, autoBreak: true, autoFocus: false, sound: true, notify: false };

  var ICON_PLAY = '<svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg>';
  var ICON_PAUSE = '<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6.5" y="5" width="3.6" height="14" rx="1"/><rect x="13.9" y="5" width="3.6" height="14" rx="1"/></svg>';
  var MOON = '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
  var SUN = '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>';

  /* ---------- Estado (se guarda: recargar no corta el temporizador) ---------- */
  var S = load();
  function load() {
    var s = null;
    try { s = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
    s = s || {};
    s.cfg = Object.assign({}, DEFAULTS, s.cfg || {});
    s.mode = s.mode || 'focus';
    s.done = s.done || 0;                 // pomodoros completos del ciclo actual
    s.endAt = s.endAt || null;            // si corre: hora de fin
    s.left = s.left != null ? s.left : s.cfg.focus * 60;   // si está en pausa: segundos restantes
    s.task = s.task || '';
    s.log = s.log || {};                  // { 'AAAA-MM-DD': { n, sec } }
    return s;
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  function total(mode) { return S.cfg[mode] * 60; }
  function running() { return !!S.endAt; }
  function remaining() { return running() ? Math.max(0, Math.round((S.endAt - Date.now()) / 1000)) : S.left; }
  function dayKey() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }

  /* ---------- Pintar ---------- */
  function fmt(s) { var m = Math.floor(s / 60), x = s % 60; return (m < 10 ? '0' : '') + m + ':' + (x < 10 ? '0' : '') + x; }
  function render() {
    var r = remaining(), t = total(S.mode);
    root.setAttribute('data-mode', S.mode);
    $('time').textContent = fmt(r);
    $('label').textContent = NAMES[S.mode] + (running() ? '' : r < t ? ' · en pausa' : '');
    $('bar').style.width = (100 * (1 - r / t)).toFixed(2) + '%';
    $('go').innerHTML = running() ? ICON_PAUSE : ICON_PLAY;
    $('go').setAttribute('aria-label', running() ? 'Pausar' : 'Empezar');
    document.querySelectorAll('#modes button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.m === S.mode)); });
    document.title = (running() || r < t ? fmt(r) + ' · ' : '') + NAMES[S.mode];
    var dots = '';
    for (var i = 0; i < S.cfg.every; i++) dots += '<i' + (i < S.done ? ' class="on"' : '') + '></i>';
    $('dots').innerHTML = dots + '<span>' + S.done + ' de ' + S.cfg.every + ' hasta el descanso largo</span>';
    var today = S.log[dayKey()] || { n: 0, sec: 0 };
    var h = Math.floor(today.sec / 3600), m = Math.round((today.sec % 3600) / 60);
    $('today').textContent = 'Hoy: ' + today.n + (today.n === 1 ? ' pomodoro' : ' pomodoros') + ' · ' + (h ? h + ' h ' : '') + m + ' min de foco';
  }

  /* ---------- Acciones ---------- */
  function start() {
    if (running()) return;
    unlockAudio();
    S.endAt = Date.now() + remaining() * 1000;
    save(); render(); keepAwake(true);
  }
  function pause() {
    if (!running()) return;
    S.left = remaining(); S.endAt = null;
    save(); render(); keepAwake(false);
  }
  function setMode(mode, autostart) {
    S.mode = mode; S.endAt = null; S.left = total(mode);
    save(); render();
    if (autostart) start(); else keepAwake(false);
  }
  function reset() { setMode(S.mode, false); }
  function nextMode() {
    if (S.mode !== 'focus') return 'focus';
    return S.done >= S.cfg.every ? 'long' : 'short';
  }
  function finish(skipped, silent) {
    var was = S.mode;
    if (was === 'focus' && !skipped) {
      S.done++;
      var k = dayKey(); S.log[k] = S.log[k] || { n: 0, sec: 0 };
      S.log[k].n++; S.log[k].sec += total('focus');
      var keys = Object.keys(S.log).sort(); while (keys.length > 60) delete S.log[keys.shift()];
    }
    if (was === 'long') S.done = 0;
    var next = nextMode();
    if (!skipped && !silent) alertDone(was, next);
    setMode(next, next === 'focus' ? S.cfg.autoFocus : S.cfg.autoBreak);
  }

  $('go').addEventListener('click', function () { running() ? pause() : start(); });
  $('reset').addEventListener('click', reset);
  $('skip').addEventListener('click', function () { finish(true); });
  $('modes').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-m]'); if (!b || b.dataset.m === S.mode) return;
    if (b.dataset.m === 'focus' && S.mode === 'long') S.done = 0;
    setMode(b.dataset.m, false);
  });
  $('task').value = S.task;
  $('task').addEventListener('input', function () { S.task = this.value; save(); });
  $('task').addEventListener('keydown', function (e) { if (e.key === 'Enter') { this.blur(); start(); } });

  document.addEventListener('keydown', function (e) {
    if (e.target.closest('input, dialog') || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === ' ') { e.preventDefault(); running() ? pause() : start(); }
    else if (e.key === 'r' || e.key === 'R') reset();
    else if (e.key === 's' || e.key === 'S') finish(true);
  });

  /* ---------- Reloj: compara contra la hora de fin, así no se atrasa en segundo plano ---------- */
  setInterval(function () {
    if (running() && remaining() <= 0) { S.left = 0; S.endAt = null; finish(false); }
    else render();
  }, 250);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && running()) { keepAwake(true); render(); }
  });

  /* ---------- Aviso al terminar ---------- */
  var actx = null;
  function unlockAudio() {
    if (!S.cfg.sound || actx) return;
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; }
  }
  function chime() {
    if (!S.cfg.sound) return;
    unlockAudio(); if (!actx) return;
    try {
      if (actx.state === 'suspended') actx.resume();
      [0, 0.28, 0.56].forEach(function (t, i) {
        var o = actx.createOscillator(), g = actx.createGain(), at = actx.currentTime + t;
        o.type = 'sine'; o.frequency.value = [659.25, 783.99, 1046.5][i];
        g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(0.25, at + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, at + 0.5);
        o.connect(g).connect(actx.destination); o.start(at); o.stop(at + 0.55);
      });
    } catch (e) {}
  }
  function alertDone(was, next) {
    var msg = was === 'focus' ? 'Terminó el foco. Ahora: ' + NAMES[next].toLowerCase() + '.' : 'Terminó el descanso. A enfocarse.';
    chime();
    try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) {}
    toast(msg);
    if (S.cfg.notify && 'Notification' in window && Notification.permission === 'granted') {
      try { new Notification('Pomodoro', { body: msg + (S.task && was === 'focus' ? ' (' + S.task + ')' : '') }); } catch (e) {}
    }
  }
  var toastTimer = null;
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 5000);
  }

  /* ---------- Pantalla encendida mientras corre (si el navegador lo permite) ---------- */
  var lock = null;
  function keepAwake(on) {
    if (on && !lock && navigator.wakeLock) {
      navigator.wakeLock.request('screen').then(function (l) { lock = l; l.addEventListener('release', function () { lock = null; }); }).catch(function () {});
    } else if (!on && lock) { lock.release().catch(function () {}); lock = null; }
  }

  /* ---------- Ajustes ---------- */
  var F = { focus: 'sFocus', short: 'sShort', long: 'sLong', every: 'sEvery' };
  var T = { autoBreak: 'sAutoBreak', autoFocus: 'sAutoFocus', sound: 'sSound', notify: 'sNotify' };
  function fill(cfg) {
    Object.keys(F).forEach(function (k) { $(F[k]).value = cfg[k]; });
    Object.keys(T).forEach(function (k) { $(T[k]).checked = !!cfg[k]; });
  }
  $('settingsBtn').addEventListener('click', function () { fill(S.cfg); $('settings').showModal(); });
  $('sDefaults').addEventListener('click', function () { fill(DEFAULTS); });
  $('sNotify').addEventListener('change', function () {
    var box = this;
    if (!box.checked) return;
    if (!('Notification' in window)) { box.checked = false; toast('Este navegador no permite avisos.'); return; }
    if (Notification.permission === 'granted') return;
    try {
      Notification.requestPermission().then(function (p) {
        if (p !== 'granted') { box.checked = false; toast('Sin permiso para avisos. Podés activarlo en los permisos del sitio.'); }
      }).catch(function () { box.checked = false; });
    } catch (e) { box.checked = false; }
  });
  $('settingsForm').addEventListener('submit', function () {
    var lim = { focus: [1, 180], short: [1, 60], long: [1, 90], every: [2, 12] };
    var before = total(S.mode);
    Object.keys(F).forEach(function (k) {
      var v = Math.round(Number($(F[k]).value));
      if (isFinite(v) && v > 0) S.cfg[k] = Math.min(lim[k][1], Math.max(lim[k][0], v));
    });
    Object.keys(T).forEach(function (k) { S.cfg[k] = $(T[k]).checked; });
    if (S.done > S.cfg.every) S.done = S.cfg.every;
    // Si no estaba corriendo y no había empezado, toma la nueva duración
    if (!running() && S.left === before) S.left = total(S.mode);
    save(); render();
  });

  /* ---------- Tema ---------- */
  var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function currentTheme() { var t = root.getAttribute('data-theme'); return t === 'dark' || t === 'light' ? t : (mq && mq.matches ? 'dark' : 'light'); }
  function paintTheme() { var d = currentTheme() === 'dark'; $('themeBtn').innerHTML = d ? SUN : MOON; $('themeBtn').setAttribute('aria-label', d ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'); }
  $('themeBtn').addEventListener('click', function () {
    var next = currentTheme() === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('gm-theme', next); } catch (e) {}
    paintTheme();
  });
  if (mq && mq.addEventListener) mq.addEventListener('change', paintTheme);
  paintTheme();

  // Si estaba corriendo y terminó con la pestaña cerrada, se cierra esa etapa sin sonar
  if (running() && remaining() <= 0) { S.endAt = null; S.left = 0; finish(false, true); toast('La etapa anterior terminó mientras no estabas.'); }
  if (running()) keepAwake(true);
  render();
})();
</script>
